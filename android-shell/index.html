<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>DizyChat</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #070311;
      color: #f5f3ff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(420px, 100%);
      text-align: center;
      padding: 28px 22px;
      border: 1px solid rgba(168, 85, 247, 0.35);
      border-radius: 18px;
      background: rgba(20, 10, 35, 0.96);
    }
    img { width: 76px; height: 76px; margin-bottom: 14px; }
    h1 { margin: 0 0 10px; font-size: 1.45rem; }
    p { margin: 0; color: #d8b4fe; line-height: 1.5; }
    button {
      margin-top: 20px;
      min-height: 44px;
      padding: 10px 20px;
      border: 0;
      border-radius: 999px;
      background: #9333ea;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button[hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <img src="/logo.svg" alt="DizyChat" />
    <h1>Starting DizyChat</h1>
    <p id="status" role="status" aria-live="polite">Checking for the latest verified app files…</p>
    <button id="retry" type="button" hidden>Retry</button>
  </main>
  <script src="/app-config.js"></script>
  <script src="/bootstrap.js"></script>
</body>
</html>
