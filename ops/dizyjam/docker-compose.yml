services:
  jacktrip:
    image: ${DIZYJAM_IMAGE:-jacktrip/jacktrip:latest}
    container_name: dizyjam-jacktrip
    network_mode: host
    privileged: true
    shm_size: 384m
    restart: unless-stopped
    ulimits:
      memlock:
        soft: 128000000
        hard: 128000000
      rtprio:
        soft: 10
        hard: 10
    volumes:
      - ./runtime:/dizyjam-auth:ro
    environment:
      SAMPLE_RATE: ${DIZYJAM_SAMPLE_RATE:-48000}
      BUFFER_SIZE: ${DIZYJAM_BUFFER_SIZE:-128}
      JACKTRIP_OPTS: >-
        -S
        -A
        --certfile /dizyjam-auth/jacktrip.crt
        --keyfile /dizyjam-auth/jacktrip.key
        --credsfile /dizyjam-auth/auth
        -z
        --hubpatch 2
        --bufstrategy 4
        -q auto
        -U ${DIZYJAM_UDP_BASE_PORT:-61002}
