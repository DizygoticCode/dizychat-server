<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">DizyChat Logo Light</title>
  <desc id="desc">Rounded teal chat bubble for light mode</desc>
  <defs>
    <linearGradient id="bubbleLight" x1="9" y1="6" x2="54" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1fa866" />
      <stop offset="1" stop-color="#0b8650" />
    </linearGradient>
    <filter id="shadowLight" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0c401f" flood-opacity="0.25" />
    </filter>
  </defs>
  <path
    fill="url(#bubbleLight)"
    filter="url(#shadowLight)"
    d="M12 10c0-4.418 3.582-8 8-8h24c4.418 0 8 3.582 8 8v18c0 4.418-3.582 8-8 8H31l-9.5 9.5a2 2 0 0 1-3.4-1.414V36h-2.1c-4.418 0-8-3.582-8-8Z"
  />
  <rect x="20" y="18" width="24" height="4" rx="2" fill="#eafff5" />
  <rect x="20" y="26" width="16" height="4" rx="2" fill="#eafff5" />
  <rect x="20" y="18" width="24" height="4" rx="2" fill="#ffffff" opacity="0.35" />
  <rect x="20" y="26" width="16" height="4" rx="2" fill="#ffffff" opacity="0.35" />
</svg>
