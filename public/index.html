<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DizyChat</title>
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <!-- Username & Room Prompt -->
  <div id="username-prompt">
    <input type="text" id="username-input" placeholder="Enter username">
    <input type="text" id="room-input" placeholder="Enter room name">
    <button id="join-btn">Join Chat</button>
  </div>

  <!-- Chat Container -->
  <div id="chat-container" style="display:none;">
    <div id="messages"></div>
    <div id="typing-bubble"></div>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="Type a message...">
      <button type="submit">Send</button>
    </form>
    <div id="emoji-picker" class="emoji-picker"></div>
    <button id="emoji-btn">😀</button>
    <input id="share-link-input" readonly>
    <button id="share-link-btn">Copy Room Link</button>
    <button id="toggle-theme">🌙</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="chat.js"></script>
</body>
</html>
