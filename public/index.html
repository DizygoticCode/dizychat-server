<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DizyChat</title>
  <link rel="icon" href="/logo.png" type="image/png" />
  <link rel="stylesheet" href="/chat.css" />
</head>

<body class="dark">
  <!-- ===========================
       Landing Page
       =========================== -->
  <div id="username-prompt">
    <img src="/logo.png" alt="DizyChat Logo" class="logo" data-dark-src="/logo.png" data-light-src="/logo-light.png" />
    <h1>Welcome to DizyChat</h1>
    <div class="landing-inputs">
      <input id="username-input" placeholder="Choose your username" />
      <input id="room-input" placeholder="Enter room name" />
      <input id="room-password" type="password" placeholder="Room password (optional)" />
      <input id="admin-password" type="password" placeholder="Admin Password" style="display:none;" autocomplete="current-password" />
      <button id="join-btn">Join Chat</button>
    </div>

    <div id="room-list">
      <h3>Available Public Rooms</h3>
      <ul id="public-room-list"></ul>
    </div>
  </div>

  <!-- ===========================
       Chat Container
       =========================== -->
  <div id="chat-container" style="display:none;">
    <header>
      <div class="header-left">
        <img src="/logo.png" alt="Logo" class="logo" data-dark-src="/logo.png" data-light-src="/logo-light.png" />
        <span id="room-name"></span>
      </div>
      <div class="header-right">
        <div class="search-bar">
          <input id="message-search" type="search" placeholder="Search messages…" aria-label="Search messages" />
          <select id="message-search-filter" aria-label="Search filter">
            <option value="all">All</option>
            <option value="pinned">Pinned</option>
            <option value="starred">Starred</option>
          </select>
        </div>
        <button id="toggle-theme" title="Toggle Theme">🌓</button>
        <button id="copy-join-link" title="Copy Join Link">
          <span class="icon" aria-hidden="true">🔗</span>
          <span class="label">Copy Join Link</span>
        </button>
        <button id="leave-btn" title="Exit Chat">Leave</button>
      </div>
    </header>

    <div id="chat-main">
      <div id="chat-content">
        <div id="pinned-messages" style="display:none;"></div>
        <div id="search-results" hidden></div>
        <div id="messages"></div>
        <div id="typing-bubble" class="hide" aria-live="polite" aria-hidden="true"></div>

        <!-- Message input -->
        <div id="reply-preview" hidden>
          <div class="reply-preview-content" tabindex="0" role="button">
            <div class="reply-preview-title">Replying to <span id="reply-preview-author"></span></div>
            <div id="reply-preview-text" class="reply-preview-text"></div>
          </div>
          <button type="button" id="reply-preview-cancel" aria-label="Cancel reply">✕</button>
        </div>
        <form id="form">
          <input type="file" id="file-input" hidden />
          <button type="button" id="file-attach" title="Attach file">📎</button>
          <button type="button" id="gif-btn" title="Send GIF">
            <span aria-hidden="true">GIF</span>
            <span class="sr-only">Open GIF picker</span>
          </button>
          <button type="button" id="emoji-btn" title="Emoji">😊</button>
          <input id="input" autocomplete="off" placeholder="Type a message..." />
          <button type="submit" title="Send">➤</button>
        </form>

        <!-- Upload progress bar -->
        <div class="upload-progress" style="display:none;">
          <div class="upload-bar"></div>
        </div>
        <!-- Visible progress element (styled purple in CSS) -->
        <progress id="upload-progress" value="0" max="100" style="display:none"></progress>

        <!-- Emoji picker -->
        <div id="emoji-picker">
          <div id="quick-emojis" hidden>
            <button>😀</button>
            <button>😂</button>
            <button>😍</button>
            <button>😎</button>
            <button>👍</button>
          </div>
        </div>
      </div>

      <aside id="user-sidebar" aria-label="Online users">
        <div class="sidebar-header">
          <h2>Online</h2>
          <span id="user-count">0</span>
        </div>
        <ul id="user-list"></ul>
        <p id="user-list-empty" class="user-empty">No one else is here yet.</p>
      </aside>
    </div>

    <div id="user-context-menu" class="user-context-menu" role="menu" aria-hidden="true" hidden></div>
  </div>

  <!-- ===========================
       Scripts
       =========================== -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/chat.js"></script>
  <script src="/fusion.js"></script>

  <script>
    const u = document.getElementById("username-input");
    const ap = document.getElementById("admin-password");
    function toggleAdminField() {
      if (!u || !ap) return;
      ap.style.display = (u.value.trim() === "Dizygotic") ? "block" : "none";
    }
    if (u) {
      u.addEventListener("input", toggleAdminField);
      toggleAdminField();
    }
  </script>
</body>
</html>
