<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DizyChat WhatsApp Style</title>
<link rel="stylesheet" href="chat.css">
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
<div id="username-prompt">
  <h2>Enter username and room</h2>
  <input id="username-input" placeholder="Username" />
  <input id="room-input" placeholder="Room (e.g., general)" />
  <button id="join-btn">Join Chat</button>
</div>

<div id="chat-container" style="display:none;">
  <div id="chat-header">
    <h2>DizyChat</h2>
    <div id="controls">
      <div id="typing-status"></div>
      <button id="toggle-theme">🌙</button>
      <button id="share-btn">Share Link</button>
    </div>
  </div>

  <div id="messages">
    <div id="typing-bubble" style="display:none; font-size:12px; color:#888; margin:2px 0;"></div>
  </div>

  <form id="form">
    <button type="button" id="emoji-btn">😊</button>
    <input id="input" placeholder="Type a message..." autocomplete="off"/>
    <button type="submit">Send</button>
  </form>

  <div id="emoji-picker" style="display:none;"></div>
</div>

<script src="chat.js"></script>
</body>
</html>
