<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DizyChat WhatsApp Style</title>
  <link rel="stylesheet" href="chat.css">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
  <!-- Username & Room Prompt -->
  <div id="username-prompt">
    <h2>Enter username and room name</h2>
    <input id="username-input" placeholder="Username" />
    <input id="room-input" placeholder="Room (e.g., general)" />
    <button id="join-btn">Join Chat</button>
  </div>

  <!-- Chat Container -->
  <div id="chat-container" style="display:none;">
    <div id="chat-header">
      <h2>DizyChat</h2>
      <div id="typing-status"></div>
      <button id="share-btn">Share Chat Link</button>
    </div>
    <div id="messages"></div>
    <div id="emoji-picker"></div>
    <form id="form">
      <input id="input" placeholder="Type a message..." autocomplete="off"/>
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="chat.js"></script>
</body>
</html>
