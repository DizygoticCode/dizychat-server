<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DizyChat AI</title>
<link rel="stylesheet" href="chat.css">
<script src="/socket.io/socket.io.js"></script>
</head>
<body>
<div id="username-prompt">
  <input id="username-input" placeholder="Enter your username">
  <input id="room-input" placeholder="Enter room name">
  <button id="join-btn">Join Chat</button>
</div>

<div id="chat-container" style="display:none;">
  <div id="messages"></div>
  <div id="typing-bubble"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Ask something...">
    <button type="submit">Send</button>
    <button id="share-btn">Share</button>
  </form>
</div>

<script src="chat.js"></script>
</body>
</html>
