<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DizyChat</title>
  <link rel="icon" href="/logo.png" type="image/png" />
  <link rel="stylesheet" href="/chat.css" />
</head>

<body class="dark">
  <!-- ===========================
       Landing Page
       =========================== -->
  <div id="username-prompt">
    <img src="/logo.png" alt="DizyChat Logo" class="logo" data-dark-src="/logo.png" data-light-src="/logo-light.png" />
    <h1>Welcome to DizyChat</h1>
    <section id="auth-panel" class="auth-panel">
      <h2>Account</h2>
      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab" data-auth-mode="login" aria-selected="true" role="tab">Sign in</button>
        <button type="button" class="auth-tab" data-auth-mode="register" role="tab" aria-selected="false">Register</button>
      </div>
      <form id="login-form" class="auth-form" autocomplete="on">
        <label for="login-username" class="sr-only">Username</label>
        <input id="login-username" name="username" placeholder="Username" autocomplete="username" />
        <label for="login-password" class="sr-only">Password</label>
        <input id="login-password" name="password" type="password" placeholder="Password" autocomplete="current-password" />
        <button type="submit">Sign in</button>
      </form>
      <form id="register-form" class="auth-form" hidden autocomplete="on">
        <label for="register-username" class="sr-only">Username</label>
        <input id="register-username" name="username" placeholder="Choose a username" autocomplete="username" />
        <label for="register-display" class="sr-only">Display name</label>
        <input id="register-display" name="displayName" placeholder="Display name" autocomplete="nickname" />
        <label for="register-password" class="sr-only">Password</label>
        <input id="register-password" name="password" type="password" placeholder="Password" autocomplete="new-password" />
        <button type="submit">Create account</button>
      </form>
      <div id="auth-summary" class="auth-summary" hidden>
        <span>Signed in as <strong id="current-user-name">Guest</strong></span>
        <button type="button" id="logout-btn">Sign out</button>
      </div>
      <p id="auth-status" class="auth-status" role="status" aria-live="polite"></p>
    </section>
    <div class="landing-inputs">
      <input id="username-input" placeholder="Sign in to chat" readonly />
      <input id="room-input" placeholder="Enter room name" />
      <input id="room-password" type="password" placeholder="Room password (optional)" />
      <input id="admin-password" type="password" placeholder="Admin Password" style="display:none;" autocomplete="current-password" />
      <button id="join-btn">Join Chat</button>
    </div>

    <div id="room-list">
      <h3>Available Public Rooms</h3>
      <ul id="public-room-list"></ul>
    </div>
  </div>

  <!-- ===========================
       Chat Container
       =========================== -->
  <div id="chat-container" style="display:none;">
    <header>
      <div class="header-left">
        <img src="/logo.png" alt="Logo" class="logo" data-dark-src="/logo.png" data-light-src="/logo-light.png" />
        <span id="room-name"></span>
      </div>
      <div class="header-right">
        <div class="search-bar">
          <input id="message-search" type="search" placeholder="Search messages…" aria-label="Search messages" />
          <select id="message-search-filter" aria-label="Search filter">
            <option value="all">All</option>
            <option value="pinned">Pinned</option>
            <option value="starred">Starred</option>
          </select>
        </div>
        <button id="toggle-theme" title="Toggle Theme">🌓</button>
        <button id="copy-join-link" title="Copy Join Link">
          <span class="icon" aria-hidden="true">🔗</span>
          <span class="label">Copy Join Link</span>
        </button>
        <button id="leave-btn" title="Exit Chat">Leave</button>
      </div>
    </header>

    <div id="chat-main">
      <div id="chat-content">
        <div id="pinned-messages" style="display:none;"></div>
        <div id="search-results" hidden></div>
        <div id="messages"></div>
        <div id="typing-bubble" style="display:none;">Someone is typing...</div>

        <!-- Message input -->
        <form id="form">
          <input type="file" id="file-input" hidden />
          <button type="button" id="file-attach" title="Attach file">📎</button>
          <button type="button" id="audio-record-btn" title="Record audio clip">🎙️</button>
          <button type="button" id="gif-btn" title="Send GIF">
            <span aria-hidden="true">GIF</span>
            <span class="sr-only">Open GIF picker</span>
          </button>
          <button type="button" id="emoji-btn" title="Emoji">😊</button>
          <input id="input" autocomplete="off" placeholder="Type a message..." />
          <button type="submit" title="Send">➤</button>
        </form>

        <!-- Upload progress bar -->
        <div class="upload-progress" style="display:none;">
          <div class="upload-bar"></div>
        </div>
        <!-- Visible progress element (styled purple in CSS) -->
        <progress id="upload-progress" value="0" max="100" style="display:none"></progress>

        <!-- Emoji picker -->
        <div id="emoji-picker">
          <div id="quick-emojis" hidden>
            <button>😀</button>
            <button>😂</button>
            <button>😍</button>
            <button>😎</button>
            <button>👍</button>
          </div>
        </div>
      </div>

      <aside id="user-sidebar" aria-label="Online users">
        <div class="sidebar-header">
          <h2>Online</h2>
          <span id="user-count">0</span>
        </div>
        <ul id="user-list"></ul>
        <p id="user-list-empty" class="user-empty">No one else is here yet.</p>
      </aside>
    </div>

    <div id="user-context-menu" class="user-context-menu" role="menu" aria-hidden="true" hidden></div>
  </div>

  <!-- ===========================
       Scripts
       =========================== -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/chat.js"></script>
  <script src="/fusion.js"></script>
</body>
</html>
