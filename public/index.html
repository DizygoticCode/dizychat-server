<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DizyChat</title>
<link rel="stylesheet" href="chat.css">
</head>
<body>
<!-- Landing / Join Page -->
<div id="username-prompt" class="landing">
    <h1>DizyChat</h1>
    <input type="text" id="username-input" placeholder="Enter your username">
    <input type="text" id="room-input" placeholder="Enter room name">
    <button id="join-btn">Join Chat</button>
</div>

<!-- Chat Page -->
<div id="chat-container" class="chat-page" style="display:none">
    <header>
        <div class="room-info">
            <span id="room-name-display"></span>
            <button id="share-btn">Share Room</button>
        </div>
        <button id="toggle-theme">🌙</button>
    </header>

    <main id="messages"></main>

    <div id="typing-bubble"></div>

    <form id="form">
        <button type="button" id="emoji-btn">😀</button>
        <input id="input" autocomplete="off" placeholder="Type a message"/>
        <button>Send</button>
    </form>

    <div id="emoji-picker" class="emoji-picker"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="chat.js"></script>
</body>
</html>
