<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DizyChat</title>
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <!-- Landing/Username Prompt -->
  <div id="username-prompt" class="overlay">
    <div class="prompt-box">
      <h2>Join a Chat Room</h2>
      <input type="text" id="username-input" placeholder="Enter your username">
      <input type="text" id="room-input" placeholder="Enter room name">
      <button id="join-btn">Join</button>
    </div>
  </div>

  <!-- Chat Container -->
  <div id="chat-container">
    <header>
      <h3 id="room-name">DizyChat</h3>
      <button id="toggle-theme">🌙</button>
      <button id="share-btn">🔗 Share</button>
    </header>

    <div id="messages" class="messages"></div>
    <div id="typing-bubble" class="typing-bubble"></div>

    <form id="form">
      <button type="button" id="emoji-btn">😊</button>
      <div id="emoji-picker" class="emoji-picker"></div>
      <input id="input" autocomplete="off" placeholder="Type a message">
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="chat.js"></script>
</body>
</html>
