<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DizyChat</title>
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <!-- Landing Page -->
  <div id="username-prompt" class="landing">
    <img src="logo.png" alt="DizyChat Logo" class="logo">
    <h2>Welcome to DizyChat</h2>
    <input id="username-input" placeholder="Enter username">
    <input id="room-input" placeholder="Enter room name">
    <button id="join-btn">Join Chat</button>
  </div>

  <!-- Chat Page -->
  <div id="chat-container" class="chat-page" style="display:none;">
    <header>
      <img src="logo.png" alt="Home" id="home-logo" class="logo">
      <span class="logo-text">DizyChat</span>
      <div class="room-info">
        <span id="room-name">Room</span>
      </div>
      <div>
        <button id="share-btn">🔗</button>
        <button id="toggle-theme">🌙</button>
      </div>
    </header>

    <main id="messages"></main>
    <div id="typing-bubble"></div>

    <form id="form">
      <button type="button" id="emoji-btn">😀</button>
      <input id="input" autocomplete="off" placeholder="Type a message..." />
      <button type="submit">➤</button>
      <div id="emoji-picker" class="emoji-picker"></div>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="chat.js"></script>
  <script>
    // Auto-scroll messages when keyboard opens or emoji picker toggles
    const messages = document.getElementById('messages');
    const input = document.getElementById('input');
    const emojiBtn = document.getElementById('emoji-btn');
    const emojiPicker = document.getElementById('emoji-picker');

    input.addEventListener('focus', () => setTimeout(() => messages.scrollTop = messages.scrollHeight, 200));
    emojiBtn.addEventListener('click', () => setTimeout(() => messages.scrollTop = messages.scrollHeight, 50));

    // Optional: Close emoji picker when resizing on mobile (keyboard open/close)
    window.addEventListener('resize', () => {
      if (window.innerWidth <= 600) emojiPicker.classList.remove('show');
    });
  </script>
</body>
</html>
