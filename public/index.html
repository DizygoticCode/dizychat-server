<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DizyChat WhatsApp</title>
<link rel="stylesheet" href="chat.css">
<script src="/socket.io/socket.io.js"></script>
</head>
<body>
<div id="landing">
  <h1>DizyChat</h1>
  <input id="username-input" placeholder="Enter username">
  <input id="room-input" placeholder="Enter room name">
  <button id="join-btn">Join Chat</button>
</div>

<div id="chat-container" style="display:none;">
  <div id="chat-header">
    <h2 id="room-name"></h2>
  </div>
  <div id="messages"></div>
  <div id="typing-bubble"></div>
  <form id="form">
    <button type="button" id="emoji-btn">😀</button>
    <input id="input" autocomplete="off" placeholder="Type a message...">
    <button type="submit">Send</button>
    <button type="button" id="share-btn">Share</button>
  </form>
  <div id="emoji-picker" style="display:none;"></div>
</div>

<script src="chat.js"></script>
</body>
</html>
