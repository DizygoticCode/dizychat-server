<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Reset DizyChat password</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/chat.css" />
  <link rel="stylesheet" href="/public-auth.css" />
</head>
<body class="dark reset-password-page">
  <main class="reset-password-card">
    <img src="/logo.svg" alt="DizyChat Logo" class="logo" />
    <h1>Reset password</h1>
    <p>Choose a new password for your registered DizyChat account.</p>

    <form id="reset-password-form">
      <input
        id="reset-password"
        type="password"
        placeholder="New password (8+ characters)"
        autocomplete="new-password"
        required
        minlength="8"
        maxlength="256"
      />
      <input
        id="reset-password-confirm"
        type="password"
        placeholder="Confirm new password"
        autocomplete="new-password"
        required
        minlength="8"
        maxlength="256"
      />
      <button id="reset-password-submit" type="submit">Reset password</button>
    </form>

    <p id="reset-password-status" class="auth-entry-status" aria-live="polite"></p>
    <a href="/login.html">Return to DizyChat sign in</a>
  </main>

  <script src="/app-config.js"></script>
  <script src="/mobile-runtime.js"></script>
  <script src="/reset-password.js"></script>
</body>
</html>
