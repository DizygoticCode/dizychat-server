name: Apply Android Native HTTP CORS

on:
  push:
    branches:
      - feat/android-slice1-core
    paths:
      - .github/workflows/apply-android-native-http-cors.yml
      - scripts/ci/apply-android-native-http-cors.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact native HTTP CORS patch
        run: python3 scripts/ci/apply-android-native-http-cors.py
      - name: Commit patch when needed
        shell: bash
        run: |
          if git diff --quiet -- index.js; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js
          git commit -m "feat: allow trusted Android HTTP origins"
          git push origin HEAD:feat/android-slice1-core
