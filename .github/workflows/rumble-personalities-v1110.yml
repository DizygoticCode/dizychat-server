          set +e
          node --test scripts/tests/rumble-burn-personalities-v1110-source.test.mjs
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Expected personality contract to fail before production implementation"
            exit 1
          fi
          echo "RED confirmed"

