name: Rumble personalities v1.11.0 TDD

on:
  push:
    branches:
      - feat/rumble-burn-personalities-v1110

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rumble-burn-personalities-v1110
