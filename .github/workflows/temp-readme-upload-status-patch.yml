name: Temporary upload status docs patch

on:
  push:
    branches:
      - docs/fix-upload-security-status
    paths:
      - .github/workflows/temp-readme-upload-status-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: docs/fix-upload-security-status
          fetch-depth: 0

      - name: Apply exact README replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          source = path.read_text(encoding='utf-8')
          replacements = {
              'It ships with MongoDB persistence, media uploads with antivirus scanning, granular moderation, and rich UX niceties such as link previews and GIF embedding.':
                  'It ships with MongoDB persistence, media uploads, granular moderation, and rich UX niceties such as link previews and GIF embedding.',
              '### Media uploads with antivirus scanning':
                  '### Media uploads',
              '- Accepts an allowlisted set of common image/audio/video/document formats via `/upload` (JPEG/JPG, PNG, GIF, WebP, HEIC/HEIF, MP3, M4A, WAV, OGG/Opus, WebM, MP4/M4V/MOV, PDF, text/CSV/JSON/Markdown, ZIP, and Office documents), stores assets under `public/uploads`, and advertises the configured size limit in logs.':
                  '- Accepts uploads via `/upload`, stores assets under `public/uploads`, and advertises the configured size limit in logs.',
              '- Streams uploads to OPSWAT MetaDefender Cloud; rejects infected files and cleans up temporary artifacts automatically.':
                  '- MIME, file-signature, and antivirus enforcement are currently disabled while mobile camera/library upload compatibility is being verified; uploaded files are not passing through those security gates for now.',
          }

          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          PY

      - name: Prove only README changed
        run: |
          git diff --check
          test "$(git diff --name-only)" = "README.md"
          git diff -- README.md

      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: state current upload security gates"
          git push origin HEAD:docs/fix-upload-security-status
