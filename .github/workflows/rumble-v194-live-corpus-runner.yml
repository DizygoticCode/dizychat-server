name: Validate Rumble v1.9.4 live-corpus fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rumble-v194-live-corpus-runner.yml'

permissions:
  contents: write

jobs:
  patch-validate-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rumble-burn-live-corpus-v194
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply guarded v1.9.4 patch
        run: python scripts/maintenance/rumble-v194-live-corpus-patch.py

      - name: Validate live-corpus contracts
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
          node --check "$SCRIPT"
          grep -F '// @version      1.9.4' "$SCRIPT"
          grep -F 'const CURATED_WEAK_TOPICS = new Set([' "$SCRIPT"
          grep -F 'curatedTokens(phrase).length >= 2' "$SCRIPT"
          grep -F 'const BURN_COMPOSER_IDLE_MS = 650;' "$SCRIPT"
          grep -F 'const BURN_COMPOSER_WAIT_MS = 12000;' "$SCRIPT"
          grep -F 'async function waitForBurnComposerIdle(initialComposer)' "$SCRIPT"
          grep -F 'function cancelBotComposerCollision(composer, expectedText)' "$SCRIPT"
          grep -F 'async function submitComposer(composer, expectedText = null)' "$SCRIPT"
          grep -F 'starts.push(words.slice(0, 2));' "$SCRIPT"
          grep -F 'botGenerated: true' "$SCRIPT"
          grep -F '"botGenerated","botEngine","botTarget","botFontStyle"' "$SCRIPT"
          grep -F 'sendChatMessage(response, { engine: lastBurnEngineUsed' "$SCRIPT"
          grep -F 'if (event.isTrusted && !botComposerMutationGuard)' "$SCRIPT"
          git diff --check

      - name: Build Chromium Firefox and Safari source
        shell: bash
        run: |
          set -euo pipefail
          ./browser-extension/scripts/fetch-vendor.sh
          node browser-extension/build.mjs
          ./browser-extension/scripts/package.sh
          test -f browser-extension/dist/dizygotic-rumble-chat-companion-v1.9.4-chromium.zip
          test -f browser-extension/dist/dizygotic-rumble-chat-companion-v1.9.4-firefox.zip
          test -f browser-extension/dist/dizygotic-rumble-chat-companion-v1.9.4-safari-source.zip
          node --check browser-extension/dist/chromium/content-core.js
          node --check browser-extension/dist/firefox/content-core.js
          node --check browser-extension/dist/safari/content-core.js
          cat browser-extension/dist/SHA256SUMS.txt

      - name: Commit exact validated product change
        shell: bash
        run: |
          set -euo pipefail
          rm -rf browser-extension/vendor browser-extension/dist
          rm -f scripts/maintenance/rumble-v194-live-corpus-patch.py
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --name-only | grep -Fx 'scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js'
          git diff --cached --name-only | grep -Fx 'scripts/maintenance/rumble-v194-live-corpus-patch.py'
          git config user.name 'DizygoticCode'
          git config user.email 'rob.noyce@gmail.com'
          git commit -m 'Harden Burn Bot from live corpus v1.9.4'
          git push origin HEAD:fix/rumble-burn-live-corpus-v194
