name: Auth v2 Branch Patcher

on:
  push:
    branches:
      - feat/auth-v2-account-foundation
    paths:
      - .auth-v2-patch-trigger

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/auth-v2-account-foundation
          fetch-depth: 0

      - name: Apply guarded index patch
        run: |
          node scripts/auth-v2/apply-index-patch.cjs
          node scripts/auth-v2/cleanup-task4-legacy-admin-session.cjs

      - name: Commit generated server patch
        shell: bash
        run: |
          if git diff --quiet -- index.js; then
            echo "No index.js changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js
          git commit -m "feat: advance Auth v2 server wiring"
          git push origin HEAD:feat/auth-v2-account-foundation
