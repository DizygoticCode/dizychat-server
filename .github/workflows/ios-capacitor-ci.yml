name: iOS Capacitor CI

on:
  push:
    branches:
      - feature/ios-capacitor-shell
  pull_request:
    paths:
      - 'ios/**'
      - 'android-shell/**'
      - 'public/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios-capacitor-ci.yml'

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run deterministic tests
        run: npm test

      - name: Prepare packaged mobile shell assets
        run: npm run android:prepare

      - name: Install matching Capacitor iOS platform
        run: npm install --no-save --package-lock=false @capacitor/ios@7.4.4

      - name: Generate Capacitor iOS project
        run: npx cap add ios

      - name: Prepare Firebase Messaging dependencies
        run: node scripts/prepare-ios-firebase.js

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Provision Firebase iOS config when available
        env:
          DIZYCHAT_GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.DIZYCHAT_GOOGLE_SERVICE_INFO_PLIST_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DIZYCHAT_GOOGLE_SERVICE_INFO_PLIST_B64:-}" ]]; then
            echo "Firebase iOS config not provisioned; compile-only validation will continue."
            exit 0
          fi

          python3 -c 'import base64, os, pathlib; pathlib.Path("ios/App/App/GoogleService-Info.plist").write_bytes(base64.b64decode(os.environ["DIZYCHAT_GOOGLE_SERVICE_INFO_PLIST_B64"]))'
          PROJECT_ID="$(/usr/libexec/PlistBuddy -c 'Print :PROJECT_ID' ios/App/App/GoogleService-Info.plist)"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' ios/App/App/GoogleService-Info.plist)"
          if [[ "$PROJECT_ID" != "dizychat" ]]; then
            echo "::error::Firebase iOS config must target project dizychat, got ${PROJECT_ID:-<missing>}."
            exit 1
          fi
          if [[ "$BUNDLE_ID" != "com.chat.dizychat" ]]; then
            echo "::error::Firebase iOS config must target bundle com.chat.dizychat, got ${BUNDLE_ID:-<missing>}."
            exit 1
          fi
          echo "Firebase iOS config validated for project dizychat / com.chat.dizychat."

      - name: Apply DizyChat native iOS bridge
        run: node scripts/prepare-ios-native.js

      - name: Build unsigned iOS Simulator app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned iOS device target
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "${RUNNER_TEMP}/dizychat-ios-device" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archive generated iOS project for port work
        uses: actions/upload-artifact@v4
        with:
          name: dizychat-ios-generated-project
          path: |
            ios
            !ios/App/App/GoogleService-Info.plist
          if-no-files-found: error
          retention-days: 7
