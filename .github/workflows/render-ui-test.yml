name: Deploy & UI Test DizyChat Render Health Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-and-ui-test:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 3.5️⃣ Install Playwright Linux dependencies (Ubuntu 24.04 compatible)
      - name: Install Playwright Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwoff1 \
            libgles2-mesa-dev \
            libx264-dev \
            libgtk-4-1 \
            libgraphene-1.0-0 \
            libvpx9 \
            libevent-2.1-7 \
            libopus0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            libavif16 \
            libharfbuzz-icu0 \
            libsecret-1-0 \
            libhyphen0 \
            libmanette-0.2-0 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libgbm1 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libasound2

      # 4️⃣ Deploy to Render
      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          curl -X POST "https://api.render.com/deploy/srv-${SERVICE_ID}" \
               -H "Authorization: Bearer ${RENDER_API_KEY}"

      # 4.5️⃣ Wait for Render deployment
      - name: Wait for Render deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "⏱️ Waiting for Render deployment to become live..."
          START_TIME=$(date +%s)
          MAX_WAIT=300
          
          while true; do
            SERVICE_INFO=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$SERVICE_ID")
            
            URL=$(echo "$SERVICE_INFO" | jq -r '.serviceDetails.url')
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            
            if [ -n "$URL" ] && [ "$HTTP_STATUS" -eq 200 ]; then
              ELAPSED=$(( $(date +%s) - START_TIME ))
              echo "✅ Render deployment is live at $URL (took ${ELAPSED}s, HTTP $HTTP_STATUS)"
              echo "DEPLOY_URL=$URL" >> $GITHUB_ENV
              break
            fi

            ELAPSED=$(( $(date +%s) - START_TIME ))
            if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "❌ Render deployment did not become live within ${MAX_WAIT}s"
              echo "Last HTTP status: $HTTP_STATUS"
              exit 1
            fi

            echo "Deployment not live yet, elapsed: ${ELAPSED}s, last HTTP status: $HTTP_STATUS"
            sleep 5
          done

      # 4.6️⃣ Buffer time to let Render app warm up
      - name: Wait for Render app to warm up
        run: |
          echo "🕐 Waiting 15 seconds for Render app to fully initialize..."
          sleep 15

      # 5️⃣ Start local server
      - name: Start local server
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          npm run start &
          echo "Waiting up to 60s for server to be ready on port 10000..."
          for i in {1..60}; do
            nc -z localhost 10000 && break
            sleep 1
          done
          echo "Server should be ready on port 10000"

      # 6️⃣ Prepare UI artifacts folder
      - name: Prepare UI artifacts folder
        run: |
          TIMESTAMP=$(date +%s)
          mkdir -p ui-test-artifacts/playwright_videos
          echo $TIMESTAMP > ui-test-artifacts/run_timestamp.txt
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          echo "🕒 Run timestamp: $TIMESTAMP"

      # 7️⃣ Install Playwright
      - name: Install Playwright
        run: |
          npm install -D playwright
          npx playwright install

      # 8️⃣ Puppeteer screenshot (quick check)
      - name: Puppeteer screenshot
        run: |
          npm install puppeteer
          node tests/render-interaction.test.js --puppeteer

      # 9️⃣ Run Playwright UI Test with retry
      - name: Run Playwright UI Test (with retry)
        run: |
          TIMESTAMP=${{ env.TIMESTAMP }}
          MAX_RETRIES=2
          COUNT=0
          until [ $COUNT -ge $MAX_RETRIES ]; do
            echo "🚀 Running Playwright attempt $((COUNT+1))/$MAX_RETRIES..."
            node tests/render-interaction.test.js && break
            COUNT=$((COUNT+1))
            if [ $COUNT -lt $MAX_RETRIES ]; then
              echo "⚠️ Retry in 10s..."
              sleep 10
            else
              echo "❌ All retries failed."
              exit 1
            fi
          done

      # 🔟 Upload all UI artifacts
      - name: Upload UI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-artifacts-${{ env.TIMESTAMP }}
          path: ui-test-artifacts/

      # 1️⃣1️⃣ Job Summary
      - name: Post summary
        if: always()
        run: |
          TIMESTAMP=${{ env.TIMESTAMP }}
          INDEX_HTML="ui-test-artifacts/index.html"
          PUPPETEER_FILE="ui-test-artifacts/puppeteer-room-$TIMESTAMP.png"
          if [ -f "$PUPPETEER_FILE" ]; then
            PUPPETEER_STATUS="✅ Puppeteer screenshot generated"
          else
            PUPPETEER_STATUS="⚠️ Puppeteer screenshot not generated"
          fi

          {
            echo "## 🧪 DizyChat UI Test Summary"
            echo ""
            echo "🕒 **Run timestamp:** $TIMESTAMP"
            echo "🌐 **Deployed URL:** [${DEPLOY_URL}](${DEPLOY_URL})"
            echo ""
            echo "### 📸 Screenshots & Videos"
            echo "- Puppeteer screenshot: \`puppeteer-room-$TIMESTAMP.png\` ($PUPPETEER_STATUS)"
            echo "- Playwright screenshot: \`playwright-room-$TIMESTAMP.png\`"
            echo "- Playwright video: \`playwright-video-$TIMESTAMP.webm\`"
            echo ""
            echo "✅ **Artifacts are available below.**"
            echo ""
            echo "🔗 [Open artifact index with all screenshots & video](./$INDEX_HTML){:target=\"_blank\"}"
          } >> $GITHUB_STEP_SUMMARY
