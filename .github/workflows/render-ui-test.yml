name: Deploy & Screenshot DizyChat Render UI Health Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-and-screenshot:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Deploy to Render
      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          curl -X POST "https://api.render.com/deploy/srv-${SERVICE_ID}" \
               -H "Authorization: Bearer ${RENDER_API_KEY}"

      # 4.1 Log average duration of last 3 successful deploys
      - name: Average duration of last 3 deploys
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "⏱️ Calculating average deploy duration from last 3 successful Render deploys..."
          DEPLOYS=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys?limit=10" | jq -r '.deploys[] | select(.state=="live") | .durationSeconds')
          
          COUNT=$(echo "$DEPLOYS" | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "No successful deploys found yet."
          else
            LAST3=$(echo "$DEPLOYS" | head -n 3)
            AVG=$(echo "$LAST3" | awk '{sum+=$1} END {printf "%.2f", sum/NR}')
            echo "Average duration of last $([ "$COUNT" -ge 3 ] && echo 3 || echo $COUNT) successful deploys: ${AVG}s"
          fi

      # 4.5 Wait for Render deployment
      - name: Wait for Render deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "⏱️ Waiting for Render deployment to finish..."
          retries=60
          while [ $retries -gt 0 ]; do
            STATUS=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$SERVICE_ID" | jq -r '.service.live' )
            if [ "$STATUS" = "true" ]; then
              echo "✅ Render deployment is live!"
              break
            fi
            retries=$((retries-1))
            echo "Deployment not live yet, retrying... $(($60 - $retries))s elapsed"
            sleep 5
          done

          if [ "$STATUS" != "true" ]; then
            echo "❌ Render deployment did not become live in time"
            exit 1
          fi

      # 5. Start local server for screenshot
      - name: Start local server
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          npm run start &
          echo "Waiting up to 60s for server to be ready on port 10000..."
          for i in {1..60}; do
            nc -z localhost 10000 && break
            sleep 1
          done
          echo "Server should be ready on port 10000"

      # 6. Take screenshot of TEST room
      - name: Take screenshot of TEST room
        run: |
          npm install puppeteer
          node -e "
          const puppeteer = require('puppeteer');
          const wait = ms => new Promise(r => setTimeout(r, ms));

          (async () => {
            const browser = await puppeteer.launch({ args: ['--no-sandbox'] });
            const page = await browser.newPage();
            const url = 'http://localhost:10000/?room=TEST';
            
            let retries = 120;  // Increased wait for server
            while (retries > 0) {
              try {
                await page.goto(url, { waitUntil: 'networkidle2', timeout: 5000 });
                break;
              } catch (err) {
                retries--;
                console.log('Waiting for server to start...', 120 - retries, 'seconds elapsed');
                await wait(1000);
                if (retries === 0) throw new Error('Server failed to respond in time');
              }
            }

            await page.waitForSelector('#messages', { timeout: 15000 });
            await wait(1000);
            await page.screenshot({ path: 'room-screenshot.png' });
            await browser.close();
            console.log('Screenshot saved: room-screenshot.png');
          })();
          "

      # 7. Upload screenshot artifact
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: room-screenshot
          path: room-screenshot.png
