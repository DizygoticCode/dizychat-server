- name: Wait for Render Deployment & Take Screenshot
  env:
    RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    MONGO_URI: ${{ secrets.MONGO_URI }}
  run: |
    echo "⏳ Waiting for Render deployment to become live..."

    start_time=$(date +%s)
    timeout=600  # maximum wait time in seconds (10 minutes)
    interval=5   # check every 5 seconds

    while true; do
      RESPONSE=$(curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" \
        "https://api.render.com/v1/services/${SERVICE_ID}")
      STATUS=$(echo "$RESPONSE" | jq -r '.service.live')
      UPDATED_AT=$(echo "$RESPONSE" | jq -r '.service.updatedAt')
      elapsed=$(( $(date +%s) - start_time ))

      echo "Elapsed: ${elapsed}s - Render live: $STATUS, last updated: $UPDATED_AT"

      if [ "$STATUS" = "true" ]; then
        echo "✅ Render deployment is live!"
        echo "⏱ Adding a 10s buffer to ensure server is fully ready..."
        sleep 10
        break
      fi

      if [ $elapsed -ge $timeout ]; then
        echo "❌ Render deployment did not become live in $timeout seconds"
        exit 1
      fi

      sleep $interval
    done

    # Start local server
    npm run start &
    SERVER_PID=$!
    echo "⏳ Waiting for local server to respond on port 10000..."

    # Wait for server port
    start_server=$(date +%s)
    while ! nc -z localhost 10000; do
      elapsed_server=$(( $(date +%s) - start_server ))
      if [ $elapsed_server -ge 120 ]; then
        echo "❌ Server failed to start in 120s"
        kill $SERVER_PID
        exit 1
      fi
      sleep 1
    done
    echo "✅ Local server ready on port 10000!"

    # Puppeteer screenshot
    npm install puppeteer
    node -e "
    const puppeteer = require('puppeteer');
    const wait = ms => new Promise(r => setTimeout(r, ms));
    (async () => {
      const browser = await puppeteer.launch({ args: ['--no-sandbox'] });
      const page = await browser.newPage();
      const url = 'http://localhost:10000/?room=TEST';

      let retries = 120;
      while (retries > 0) {
        try {
          await page.goto(url, { waitUntil: 'networkidle2', timeout: 3000 });
          break;
        } catch (err) {
          retries--;
          console.log('Waiting for server to respond...', 120 - retries, 'seconds elapsed');
          await wait(1000);
          if (retries === 0) throw new Error('Server failed to respond in time');
        }
      }

      await page.waitForSelector('#messages', { timeout: 10000 });
      await page.waitForTimeout(1000);
      await page.screenshot({ path: 'room-screenshot.png' });
      await browser.close();
      console.log('✅ Screenshot saved: room-screenshot.png');
    })();

    kill $SERVER_PID
