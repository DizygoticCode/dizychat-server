name: Deploy & Screenshot DizyChat Render UI Health Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-and-screenshot:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Deploy to Render
      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          curl -X POST "https://api.render.com/deploy/srv-${SERVICE_ID}" \
               -H "Authorization: Bearer ${RENDER_API_KEY}"

      # 4.5 Wait for Render deployment (dynamic) with HTTP status logging
      - name: Wait for Render deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "⏱️ Waiting for Render deployment to become live..."
          START_TIME=$(date +%s)
          MAX_WAIT=300  # Maximum wait time 5 minutes
          
          while true; do
            SERVICE_INFO=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$SERVICE_ID")
            
            URL=$(echo "$SERVICE_INFO" | jq -r '.serviceDetails.url')
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            
            if [ -n "$URL" ] && [ "$HTTP_STATUS" -eq 200 ]; then
              ELAPSED=$(( $(date +%s) - START_TIME ))
              echo "✅ Render deployment is live at $URL (took ${ELAPSED}s, HTTP $HTTP_STATUS)"
              break
            fi

            ELAPSED=$(( $(date +%s) - START_TIME ))
            if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "❌ Render deployment did not become live within ${MAX_WAIT}s"
              echo "Last HTTP status: $HTTP_STATUS"
              exit 1
            fi

            echo "Deployment not live yet, elapsed: ${ELAPSED}s, last HTTP status: $HTTP_STATUS"
            sleep 5
          done

      # 5. Start local server for screenshot
      - name: Start local server
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          npm run start &
          echo "Waiting up to 60s for server to be ready on port 10000..."
          for i in {1..60}; do
            nc -z localhost 10000 && break
            sleep 1
          done
          echo "Server should be ready on port 10000"

      # 6. Take screenshot of TEST room
      - name: Take screenshot of TEST room
        run: |
          npm install puppeteer
          node -e "
          const puppeteer = require('puppeteer');
          const wait = ms => new Promise(r => setTimeout(r, ms));

          (async () => {
            const browser = await puppeteer.launch({ args: ['--no-sandbox'] });
            const page = await browser.newPage();
            const url = 'http://localhost:10000/?room=TEST';
            
            let retries = 60;
            while (retries > 0) {
              try {
                await page.goto(url, { waitUntil: 'networkidle2', timeout: 3000 });
                break;
              } catch (err) {
                retries--;
                console.log('Waiting for server to start...', 60 - retries, 'seconds elapsed');
                await wait(1000);
                if (retries === 0) throw new Error('Server failed to respond in time');
              }
            }

            await page.waitForSelector('#messages', { timeout: 10000 });
            await wait(1000);
            await page.screenshot({ path: 'room-screenshot.png' });
            await browser.close();
            console.log('Screenshot saved: room-screenshot.png');
          })();
          "

      # 7. Upload screenshot artifact
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: room-screenshot
          path: room-screenshot.png
