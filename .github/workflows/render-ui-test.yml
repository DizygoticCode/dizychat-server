name: Deploy & Screenshot DizyChat Render UI Health Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-and-screenshot:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Deploy to Render
      - name: Deploy to Render
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Checking secrets..."
          if [ -z "${RENDER_API_KEY}" ]; then
            echo "Warning: RENDER_API_KEY is empty"
          fi
          if [ -z "${SERVICE_ID}" ]; then
            echo "Warning: SERVICE_ID is empty"
          fi
          curl -X POST "https://api.render.com/deploy/srv-${SERVICE_ID}" \
               -H "Authorization: Bearer ${RENDER_API_KEY}" || echo "Render deploy API call failed, continuing with fallback port"

      # 5. Get Render service info and port (with fallback)
      - name: Get Render service port
        id: get-port
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Fetching Render service info..."
          SERVICE_JSON=$(curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services/${SERVICE_ID}")
          if [ -z "$SERVICE_JSON" ] || ! echo "$SERVICE_JSON" | jq -e '.service' >/dev/null 2>&1; then
            echo "Render API failed or service info missing, using fallback port 10000"
            echo "PORT=10000" >> $GITHUB_ENV
          else
            PORT=$(echo "$SERVICE_JSON" | jq -r '.service.envVars[] | select(.key=="PORT") | .value')
            echo "Render port is $PORT"
            echo "PORT=$PORT" >> $GITHUB_ENV
          fi

      # 6. Start local server for screenshot
      - name: Start local server
        run: |
          npm run start & 
          echo "Waiting up to 50s for server to be ready..."
          for i in {1..50}; do
            nc -z localhost $PORT && break
            sleep 1
          done
          echo "Server should be ready on port $PORT"

      # 7. Take screenshot of TEST room
      - name: Take screenshot of TEST room
        run: |
          npm install puppeteer
          node -e "
          const puppeteer = require('puppeteer');
          const port = process.env.PORT || 10000;
          const wait = ms => new Promise(r => setTimeout(r, ms));

          (async () => {
            const browser = await puppeteer.launch({ args: ['--no-sandbox'] });
            const page = await browser.newPage();
            const url = `http://localhost:${port}/?room=TEST`;
            
            let retries = 60;
            while (retries > 0) {
              try {
                await page.goto(url, { waitUntil: 'networkidle2', timeout: 3000 });
                break;
              } catch (err) {
                retries--;
                console.log('Waiting for server to start...', 60 - retries, 'seconds elapsed');
                await wait(1000);
                if (retries === 0) throw err;
              }
            }

            await page.waitForSelector('#messages', { timeout: 10000 });
            await page.waitForTimeout(1000);
            await page.screenshot({ path: 'room-screenshot.png' });
            await browser.close();
            console.log('Screenshot saved: room-screenshot.png');
          })();
          "

      # 8. Upload screenshot artifact
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: room-screenshot
          path: room-screenshot.png
