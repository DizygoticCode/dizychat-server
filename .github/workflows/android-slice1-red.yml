name: Android Slice 1 Focused

on:
  push:
    branches:
      - feat/android-slice1-core
    paths:
      - .github/workflows/android-slice1-red.yml
      - tests/android-mobile-runtime.test.js
      - tests/android-native-cors.test.js
      - tests/android-bootstrap-contract.test.js
      - public/mobile-runtime.js
      - public/mobile-bootstrap.js
      - public/app-config.js
      - public/login.html
      - public/index.html
      - index.js

jobs:
  android-slice1-focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Android Slice 1 boundary contracts
        run: node --test tests/android-mobile-runtime.test.js tests/android-native-cors.test.js tests/android-bootstrap-contract.test.js
