name: Android Slice 1 Focused

on:
  push:
    branches:
      - feat/android-slice1-core
    paths:
      - .github/workflows/android-slice1-red.yml
      - tests/android-mobile-runtime.test.js
      - tests/android-native-cors.test.js
      - tests/android-bootstrap-contract.test.js
      - tests/android-secure-session.test.js
      - tests/android-native-contract.test.js
      - public/mobile-runtime.js
      - public/mobile-bootstrap.js
      - public/app-config.js
      - public/auth-v2-client.js
      - public/chat.js
      - public/login.html
      - public/index.html
      - android/app/build.gradle
      - android/app/src/main/AndroidManifest.xml
      - android/app/src/main/java/com/chat/dizychat/SecureSessionPlugin.java
      - android/app/src/main/java/com/chat/dizychat/MobileShellPlugin.java
      - android/app/src/main/java/com/chat/dizychat/MainActivity.java
      - index.js

jobs:
  android-slice1-focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Android Slice 1 focused contracts
        run: node --test tests/android-mobile-runtime.test.js tests/android-native-cors.test.js tests/android-bootstrap-contract.test.js tests/android-secure-session.test.js tests/android-native-contract.test.js
