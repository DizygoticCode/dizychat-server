name: Android Slice 1 Focused

on:
  push:
    branches:
      - feat/android-slice1-core
    paths:
      - .github/workflows/android-slice1-red.yml

jobs:
  android-slice1-focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run durable mobile session contracts
        run: node --test tests/mobile-device-session.test.js tests/mobile-device-session-wiring.test.js
