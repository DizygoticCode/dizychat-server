name: Apply LiveKit Music Mode fix

on:
  push:
    branches:
      - fix/livekit-music-mode-max-quality

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message != 'fix: restore max-quality LiveKit Music Mode' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/livekit-music-mode-max-quality
          fetch-depth: 0
      - name: Apply deterministic patch
        run: node scripts/apply-livekit-music-mode-fix.js
      - name: Remove one-shot patch machinery
        run: rm scripts/apply-livekit-music-mode-fix.js .github/workflows/apply-livekit-music-mode-fix.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server-core.js public/chat.js public/chat.css scripts/apply-livekit-music-mode-fix.js .github/workflows/apply-livekit-music-mode-fix.yml
          git diff --cached --check
          git commit -m "fix: restore max-quality LiveKit Music Mode"
          git push origin HEAD:fix/livekit-music-mode-max-quality
