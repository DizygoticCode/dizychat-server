name: Run Rumble v1.9.3 burn rotation patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rumble-v193-runner.yml'
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch-validate-push:
    if: github.event_name == 'push' || github.event.issue.title == 'PATCH_RUMBLE_V193_ROTATION'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rumble-burn-rotation-v193
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply guarded patch
        run: python scripts/maintenance/rumble-v193-burn-rotation-patch.py

      - name: Validate userscript contracts
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
          node --check "$SCRIPT"
          grep -F '// @version      1.9.3' "$SCRIPT"
          grep -F 'settings.curatedBurnReviewBeforeUse = false;' "$SCRIPT"
          ! grep -Fq 'Review before send' "$SCRIPT"
          ! grep -Fq 'confirm(`Curated burn for' "$SCRIPT"
          grep -F '<label>Primary engine</label>' "$SCRIPT"
          grep -F 'const engineOrder = [primary, "curated", "custom", "compromise", "rita", "markov", "builtin"]' "$SCRIPT"
          grep -F 'const RECENT_BURN_LIMIT = 12;' "$SCRIPT"
          grep -F 'if (!isRecentBurn(candidate))' "$SCRIPT"
          grep -F 'rememberRecentBurn(response);' "$SCRIPT"
          grep -F 'generated via ${lastBurnEngineUsed}' "$SCRIPT"
          git diff --check

      - name: Build Chromium Firefox and Safari source
        shell: bash
        run: |
          set -euo pipefail
          ./browser-extension/scripts/fetch-vendor.sh
          node browser-extension/build.mjs
          ./browser-extension/scripts/package.sh
          test -f browser-extension/dist/dizygotic-rumble-chat-companion-v1.9.3-chromium.zip
          test -f browser-extension/dist/dizygotic-rumble-chat-companion-v1.9.3-firefox.zip
          test -f browser-extension/dist/dizygotic-rumble-chat-companion-v1.9.3-safari-source.zip
          node --check browser-extension/dist/chromium/content-core.js
          node --check browser-extension/dist/firefox/content-core.js
          node --check browser-extension/dist/safari/content-core.js
          cat browser-extension/dist/SHA256SUMS.txt

      - name: Commit only validated product files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf browser-extension/vendor browser-extension/dist
          rm -f .github/rumble-v193-request scripts/maintenance/rumble-v193-burn-rotation-patch.py
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git diff --cached --name-only | grep -Fx 'README.md'
          git diff --cached --name-only | grep -Fx 'browser-extension/README.md'
          git diff --cached --name-only | grep -Fx 'scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js'
          git diff --cached --name-only | grep -Fx '.github/rumble-v193-request'
          git diff --cached --name-only | grep -Fx 'scripts/maintenance/rumble-v193-burn-rotation-patch.py'
          git config user.name 'DizygoticCode'
          git config user.email 'rob.noyce@gmail.com'
          git commit -m 'Fix Burn Bot engine priority and repetition v1.9.3'
          git push origin HEAD:fix/rumble-burn-rotation-v193

