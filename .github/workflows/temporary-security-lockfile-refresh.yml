# Temporary, branch-scoped lockfile regeneration; remove before merging.
name: Security patch lockfile refresh
on:
  push:
    branches: [fix/security-multer-2-4-0]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Resolve only the reviewed package manifest updates
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify manifest and lockfile agree on the exact patched versions
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const l = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const wanted = {"multer":"2.4.0"};
          for (const [name, version] of Object.entries(wanted)) {
            const declared = p.dependencies?.[name] ?? p.devDependencies?.[name];
            const locked = l.packages?.['node_modules/' + name]?.version;
            if (declared !== version || locked !== version) {
              throw new Error(name + ': declared=' + declared + ' locked=' + locked + ' expected=' + version);
            }
          }
          NODE
      - run: npm ci
      - run: npm test
      - name: Commit generated lockfile to this dedicated patch branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(lock): resolve reviewed security patches"
            git push origin HEAD:fix/security-multer-2-4-0
          fi
