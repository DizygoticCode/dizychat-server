name: One-off Rumble Curated v2 v1.10.0

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  test-and-patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/rumble-curated-v2-v1100'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rumble-curated-v2-v1100
          fetch-depth: 0
      - name: Apply Curated v2 implementation patch
        run: python scripts/patch-rumble-curated-v2-v1100.py
      - name: Run Curated v2 regression contract
        run: node --test scripts/tests/rumble-curated-v2-source.test.mjs
      - name: Run existing Rumble source regressions
        shell: bash
        run: |
          set -euo pipefail
          for testfile in scripts/tests/rumble-*-source.test.mjs; do
            node --test "$testfile"
          done
      - name: Verify userscript syntax
        run: node --check scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
      - name: Verify diff whitespace
        run: git diff --check
      - name: Commit verified Curated v2 implementation
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/patch-rumble-curated-v2-v1100.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js \
            scripts/tests/rumble-curated-v2-source.test.mjs \
            scripts/tests/rumble-chat-indexeddb-source.test.mjs \
            scripts/tests/rumble-burn-reply-delay-source.test.mjs \
            scripts/patch-rumble-curated-v2-v1100.py
          git diff --cached --check
          git commit -m 'Upgrade Rumble Curated engine to v2 v1.10.0'
          git push origin HEAD:feat/rumble-curated-v2-v1100
