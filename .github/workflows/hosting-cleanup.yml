name: Self-hosted repository cleanup

on:
  push:
    branches:
      - chore/remove-legacy-hosting
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: chore/remove-legacy-hosting
          fetch-depth: 0

      - name: Remove legacy hosting references from normal files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path('.')

          # Provider-specific test superseded by the local UI smoke test.
          old_test = root / 'tests/render-interaction.test.js'
          if old_test.exists():
              old_test.unlink()

          readme = root / 'README.md'
          if readme.exists():
              s = readme.read_text()
              s = s.replace('store it server-side in Render environment variables.', 'store it in the protected service environment.')
              s = s.replace('Keep this server-side in Render environment variables; clients only see generated W2G room links.', 'Keep this in the protected service environment; clients only see generated W2G room links.')
              s = s.replace('add the key to Render as `GIPHY_SDK_KEY` and redeploy.', 'set `GIPHY_SDK_KEY` in the protected service environment and restart the service.')
              s = re.sub(r'^3\. \*\*Use Render only if.*?same Node/Express process\.\n', '', s, flags=re.M)
              s = s.replace('4. **Use `livekit-server --dev` only for local testing.**', '3. **Use `livekit-server --dev` only for local testing.**')
              s = s.replace('Set those variables only when you want Render to point users at', 'Set those variables only when you want the deployment to point users at')
              s = s.replace('smoke tests that hit the deployed Render instance', 'smoke tests that hit the configured DizyChat instance')
              s = s.replace('node tests/ui-test.cjs             # Playwright only', 'node tests/ui-test.cjs             # Playwright only; defaults to local server')
              marker = '## Self-hosted production'
              if marker not in s:
                  s += '\n\n## Self-hosted production\n\nThe production DizyChat service is self-hosted behind Caddy at `https://dizychat.com`. The Node service listens on a private local port, MongoDB remains bound to localhost, and persistent soundboards/uploads live under `/var/soundboards`. Runtime secrets belong in a protected service environment file and are never committed. Only the reverse-proxy HTTP/HTTPS edge should be public.\n'
              readme.write_text(s)

          app_config = root / 'public/app-config.js'
          if app_config.exists():
              s = app_config.read_text()
              s = re.sub(r'socketUrl:\s*"https://(?:dizychat-server\.)?onrender\.com"', 'socketUrl: ""', s)
              s = re.sub(r'defaultNativeSocketUrl:\s*"https://(?:dizychat-server\.)?onrender\.com"', 'defaultNativeSocketUrl: "https://dizychat.com"', s)
              s = s.replace('https://dizychat-server.onrender.com', 'https://dizychat.com')
              s = s.replace('https://dizychat.onrender.com', 'https://dizychat.com')
              app_config.write_text(s)

          ui_test = root / 'tests/ui-test.cjs'
          if ui_test.exists():
              s = ui_test.read_text()
              s = s.replace('"https://dizychat-server.onrender.com"', '"http://127.0.0.1:10000"')
              s = s.replace('console.log("⏳ Waiting 15s for Render app to fully initialize...");\n    await delay(15000);', 'console.log("⏳ Waiting briefly for the configured DizyChat service...");\n    await delay(1000);')
              ui_test.write_text(s)

          security = root / 'docs/security-runbook.md'
          if security.exists():
              s = security.read_text().replace('WAF / reverse proxy / Render rules', 'reverse proxy / firewall rules')
              security.write_text(s)

          # Replace provider branding/URLs in normal tracked text only. Workflow files are
          # handled directly through the GitHub app because Actions cannot rewrite them here.
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          for rel in filter(None, tracked):
              if rel.startswith('.github/workflows/'):
                  continue
              p = root / rel
              if not p.exists():
                  continue
              try:
                  s = p.read_text()
              except UnicodeDecodeError:
                  continue
              old = s
              s = s.replace('https://dizychat-server.onrender.com', 'https://dizychat.com')
              s = s.replace('https://dizychat.onrender.com', 'https://dizychat.com')
              s = s.replace('dizychat-server.onrender.com', 'dizychat.com')
              s = s.replace('dizychat.onrender.com', 'dizychat.com')
              s = s.replace('Render environment variables', 'protected service environment variables')
              s = s.replace('Render environment', 'protected service environment')
              s = s.replace('Render deployment', 'self-hosted deployment')
              s = s.replace('Render instance', 'self-hosted instance')
              s = s.replace('Render service', 'self-hosted service')
              s = re.sub(r'\bRender\b', 'self-hosted deployment', s)
              if s != old:
                  p.write_text(s)

          banned = ['onrender.com', 'api.render.com', 'RENDER_']
          leftovers = []
          for rel in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0'):
              if not rel or rel.startswith('.github/workflows/'):
                  continue
              p = root / rel
              if not p.exists():
                  continue
              try:
                  s = p.read_text()
              except UnicodeDecodeError:
                  continue
              for token in banned:
                  if token in s:
                      leftovers.append(f'{rel}: {token}')
              if re.search(r'\bRender\b', s):
                  leftovers.append(f'{rel}: standalone provider name')
          if leftovers:
              raise SystemExit('Legacy hosting references remain:\n' + '\n'.join(leftovers))
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No normal-file cleanup changes required."
            exit 0
          fi
          git config user.name "DizygoticCode"
          git config user.email "rob.noyce@gmail.com"
          git add -A -- ':!.github/workflows'
          git commit -m "chore: remove legacy hosting integration"
          git push origin HEAD:chore/remove-legacy-hosting
