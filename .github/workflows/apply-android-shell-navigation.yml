name: Apply Android Shell Navigation

on:
  push:
    branches:
      - feat/android-slice1-core
    paths:
      - .github/workflows/apply-android-shell-navigation.yml
      - scripts/ci/apply-android-shell-navigation.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact Android shell navigation patch
        run: python3 scripts/ci/apply-android-shell-navigation.py
      - name: Commit patch when needed
        shell: bash
        run: |
          if git diff --quiet -- public/chat.js; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/chat.js
          git commit -m "feat: add Android shell navigation"
          git push origin HEAD:feat/android-slice1-core
