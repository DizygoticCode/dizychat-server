name: Apply Android README

on:
  push:
    branches:
      - feat/android-slice1-core
    paths:
      - .github/workflows/apply-android-readme.yml
      - scripts/ci/apply-android-readme.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply private Android README section
        run: python3 scripts/ci/apply-android-readme.py
      - name: Commit README when needed
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "No README patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: link private Android APK runbook"
          git push origin HEAD:feat/android-slice1-core
