name: Refresh brace-expansion 1.1.21 lockfile

on:
  push:
    branches:
      - chore/brace-expansion-1.1.21
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/brace-expansion-1.1.21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh only brace-expansion lockfile state
        run: npm install --package-lock-only --ignore-scripts --save-dev --save-exact brace-expansion@1.1.21
      - name: Verify lockfile audit
        run: npm audit --package-lock-only --audit-level=moderate
      - name: Commit generated package metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo "No package metadata changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: refresh brace-expansion 1.1.21 lockfile"
          git push origin HEAD:chore/brace-expansion-1.1.21
