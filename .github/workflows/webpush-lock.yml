name: Temporary Web Push Lockfile

on:
  push:
    branches:
      - fix/android-notification-channel-bootstrap
    paths:
      - '.github/workflows/webpush-lock.yml'

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install web-push@3.6.7 --save --package-lock-only
      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Add Web Push dependency"
          git push origin HEAD:fix/android-notification-channel-bootstrap
