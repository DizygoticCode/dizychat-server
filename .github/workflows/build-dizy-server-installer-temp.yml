name: Diagnose DIZY Server Installer

on:
  push:
    branches:
      - build/dizy-server-installer-run
    paths:
      - '.github/workflows/build-dizy-server-installer-temp.yml'
      - 'installer/DIZY-ISO-BUILD-TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact installer source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            installer/dizy-server-source-v3.part-01 \
            installer/dizy-server-source-v3.part-02 \
            installer/dizy-server-source-v3.part-03a \
            installer/dizy-server-source-v3.part-03b \
            installer/dizy-server-source-v3.part-03c \
            installer/dizy-server-source-v3.part-03d \
            installer/dizy-server-source-v3.part-04 \
            installer/dizy-server-source-v3.part-05 \
            installer/dizy-server-source-v3.part-06 \
            > /tmp/dizy-server-source.b64
          base64 --decode /tmp/dizy-server-source.b64 > /tmp/dizy-server-source.tar.gz
          mkdir -p /tmp/dizy-server
          tar -xzf /tmp/dizy-server-source.tar.gz -C /tmp/dizy-server
      - name: Show failing CLI extraction seam
        shell: bash
        run: |
          set -euo pipefail
          echo '=== exact error string matches ==='
          grep -RFn -C 35 -- 'Could not extract a working CLI binary' /tmp/dizy-server || true
          grep -RFn -C 35 -- 'could not extract a working CLI binary' /tmp/dizy-server || true
          echo '=== gh / cli install references ==='
          grep -RniE -C 12 -- 'gh_cli|github cli|cli binary|gh version|gh_' /tmp/dizy-server/dizy /tmp/dizy-server/scripts /tmp/dizy-server/tests || true
          exit 1
