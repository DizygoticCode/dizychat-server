name: Diagnose DIZY Server Installer

on:
  push:
    branches:
      - build/dizy-server-installer-run
    paths:
      - '.github/workflows/build-dizy-server-installer-temp.yml'
      - 'installer/DIZY-ISO-BUILD-TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact installer source
        shell: bash
        run: |
          set -euo pipefail
          cat installer/dizy-server-source-v3.part-01 installer/dizy-server-source-v3.part-02 installer/dizy-server-source-v3.part-03a installer/dizy-server-source-v3.part-03b installer/dizy-server-source-v3.part-03c installer/dizy-server-source-v3.part-03d installer/dizy-server-source-v3.part-04 installer/dizy-server-source-v3.part-05 installer/dizy-server-source-v3.part-06 > /tmp/dizy-server-source.b64
          base64 --decode /tmp/dizy-server-source.b64 > /tmp/dizy-server-source.tar.gz
          mkdir -p /tmp/dizy-server
          tar -xzf /tmp/dizy-server-source.tar.gz -C /tmp/dizy-server
      - name: Show exact nvme-cli contract
        shell: bash
        run: |
          set -euo pipefail
          echo '=== preflight nvme block ==='
          sed -n '1,130p' /tmp/dizy-server/dizy/preflight.sh
          echo '=== all NVME_BIN / nvme-cli uses ==='
          grep -RniE -C 6 -- 'NVME_BIN|nvme-cli|nvme format|nvme sanitize' /tmp/dizy-server/dizy /tmp/dizy-server/tests || true
          exit 1
