name: Apply and validate Rumble Companion v1.9 curated burns

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'feat/rumble-curated-burns-v19'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Detect already-applied release
        id: state
        shell: bash
        run: |
          if grep -q '^// @version      1\.9$' scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js; then
            echo 'done=true' >> "$GITHUB_OUTPUT"
          else
            echo 'done=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply curated-burn release patch
        if: steps.state.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tampermonkey/apply-v19-curated.py

      - name: Validate userscript contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
          python -c "from pathlib import Path; s=Path('scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js').read_text(); assert '// @version      1.9' in s; assert 'rumbleCuratedBurnsV1' in s; assert 'ingestCuratedRecord(record);' in s; assert 'const engineOrder = [\"curated\", preferred' in s; assert 'sourceSeqs:' in s; assert 'saveLocalBackup(\"auto\")' in s; assert 'window.rumbleBlocker.getCuratedBurns' in s"

      - name: Build Chromium Firefox and Safari packages
        shell: bash
        run: |
          set -euo pipefail
          bash browser-extension/scripts/fetch-vendor.sh
          node browser-extension/build.mjs
          bash browser-extension/scripts/package.sh
          node --check browser-extension/dist/chromium/content-core.js
          node --check browser-extension/dist/firefox/content-core.js
          node --check browser-extension/dist/safari/content-core.js
          python -c "import json,pathlib; root=pathlib.Path('browser-extension/dist'); [(_ for _ in ()).throw(AssertionError((t,json.loads((root/t/'manifest.json').read_text())['version']))) for t in ('chromium','firefox','safari') if json.loads((root/t/'manifest.json').read_text())['version'] != '1.9']"
          cat browser-extension/dist/SHA256SUMS.txt

      - name: Commit verified v1.9 branch
        if: steps.state.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/tampermonkey/apply-v19-curated.py
          git add scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js README.md browser-extension/README.md
          git config user.name 'DizygoticCode'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Add automatic curated burn memory in Rumble Companion v1.9'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
