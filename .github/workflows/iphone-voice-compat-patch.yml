name: Temporary iPhone Voice Compatibility Patch

on:
  push:
    branches:
      - fix/iphone-voice-message-compat

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/iphone-voice-message-compat
          fetch-depth: 0

      - name: Apply exact compatibility patch
        run: node scripts/apply-iphone-voice-compat-patch.js

      - name: Commit patched production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/chat.js index.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: normalize voice messages for older iPhones"
          git push origin HEAD:fix/iphone-voice-message-compat
