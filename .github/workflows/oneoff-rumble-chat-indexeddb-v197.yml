name: One-off Rumble chat IndexedDB v1.9.7

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  test-and-patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/rumble-chat-indexeddb-v197'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rumble-chat-indexeddb-v197
          fetch-depth: 0

      - name: Apply IndexedDB implementation patch when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/patch-rumble-chat-indexeddb-v197.py ]; then
            python scripts/patch-rumble-chat-indexeddb-v197.py
          fi

      - name: Run IndexedDB transcript regression test
        run: node --test scripts/tests/rumble-chat-indexeddb-source.test.mjs

      - name: Verify userscript syntax
        run: node --check scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js

      - name: Verify diff whitespace
        run: git diff --check

      - name: Commit verified implementation when patch helper exists
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f scripts/patch-rumble-chat-indexeddb-v197.py ]; then
            exit 0
          fi
          rm scripts/patch-rumble-chat-indexeddb-v197.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js \
            scripts/tests/rumble-chat-indexeddb-source.test.mjs \
            scripts/patch-rumble-chat-indexeddb-v197.py
          git diff --cached --check
          git commit -m 'Move Rumble transcript storage to IndexedDB v1.9.7'
          git push origin HEAD:fix/rumble-chat-indexeddb-v197
