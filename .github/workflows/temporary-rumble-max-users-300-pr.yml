name: Temporary PR verifier for Rumble max users 300

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'feat/rumble-curated-max-users-300'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Exact head
        shell: bash
        run: |
          echo "head=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Userscript syntax
        run: node --check scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js

      - name: Rumble source regressions
        run: node --test scripts/tests/*.test.mjs
