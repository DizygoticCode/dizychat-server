name: One-off Rumble chat import implementation

on:
  push:
    branches:
      - fix/rumble-chat-history-import
    paths:
      - '.github/workflows/oneoff-rumble-chat-import.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rumble-chat-history-import
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch userscript and version contract
        run: |
          echo '' | base64 -d > /tmp/patch-rumble-chat-import.py
          python /tmp/patch-rumble-chat-import.py
      - name: Verify implementation
        run: |
          node --check scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
          node --test scripts/tests/*.test.mjs
      - name: Commit implementation and remove one-off workflow
        run: |
          git config user.name "DizygoticCode"
          git config user.email "rob.noyce@gmail.com"
          git rm .github/workflows/oneoff-rumble-chat-import.yml
          git add scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js scripts/tests/rumble-userscript-version-source.test.mjs
          git commit -m "Add IndexedDB chat history import"
          git push origin HEAD:fix/rumble-chat-history-import
