name: One-off Rumble large transcript repair

on:
  push:
    branches:
      - fix/rumble-large-transcript-loader
    paths:
      - '.github/workflows/oneoff-fix-rumble-large-transcript.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rumble-large-transcript-loader

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Replace unsafe large-array sequence calculation
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js';
          const oldLine = 'chatSequence = chatLog.length ? Math.max(...chatLog.map((r) => Number(r.seq) || 0)) : 0;';
          const replacement = [
            'chatSequence = chatLog.reduce(',
            '                    (max, record) => Math.max(max, Number(record.seq) || 0),',
            '                    0',
            '                );'
          ].join('\n');
          let source = fs.readFileSync(path, 'utf8');
          const count = source.split(oldLine).length - 1;
          if (count !== 2) {
            throw new Error(`Expected exactly 2 unsafe sequence calculations, found ${count}`);
          }
          source = source.split(oldLine).join(replacement);
          fs.writeFileSync(path, source);
          NODE

      - name: Verify userscript syntax
        run: node --check scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js

      - name: Run full userscript regression suite
        run: node --test scripts/tests/*.test.mjs

      - name: Commit repair and remove one-off workflow
        run: |
          git config user.name 'DizygoticCode'
          git config user.email 'rob.noyce@gmail.com'
          git rm .github/workflows/oneoff-fix-rumble-large-transcript.yml
          git add scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
          git commit -m 'Fix large IndexedDB transcript startup'
          git push origin HEAD:fix/rumble-large-transcript-loader
