name: Apply Burn Memory Intelligence

on:
  push:
    branches:
      - feat/burn-memory-intelligence

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/burn-memory-intelligence
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch once
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^// @version      1\.12\.3$' scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js; then
            python3 scripts/maintenance/apply-burn-memory-intelligence.py
          elif ! grep -q 'const profileReady = !incomingBlocked && !!profile' scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js; then
            python3 scripts/maintenance/repair-burn-memory-compat.py
          else
            echo 'Burn memory intelligence patch already applied; nothing to do.'
            exit 0
          fi

          node --check scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
          node --test scripts/tests/*.test.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
          git commit -m 'fix: preserve curated memory ranking contracts'
          git push origin HEAD:feat/burn-memory-intelligence
