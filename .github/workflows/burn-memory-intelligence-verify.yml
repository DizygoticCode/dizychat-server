name: Burn Memory Intelligence Verify

on:
  push:
    branches:
      - feat/burn-memory-intelligence

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check userscript
        run: node --check scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
      - name: Run userscript regression tests
        run: node --test scripts/tests/*.test.mjs
