name: Install exact Rumble Chat Tool v1.8

on:
  push:
    paths:
      - '.github/workflows/install-rumble-v18.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reconstruct and verify exact v1.8
        shell: python
        run: |
          import base64
          import bz2
          import hashlib
          from pathlib import Path

          payload = """





 
J8/0D8xPoMaUQe8pZucZC8sfRgPqe8Peuk3k/mcwOSL78h9R3nvWuGEP/i7kinChITlI9NQ="""
          data = bz2.decompress(base64.b64decode(payload))
          digest = hashlib.sha256(data).hexdigest()
          expected = "c499c86bbca43dd4cbdfdade5c84a62e1cd1bf709bf6403dd2f1e7e59fa01a73"
          if digest != expected:
              raise SystemExit(f"SHA-256 mismatch: {digest} != {expected}")
          if len(data) != 82546:
              raise SystemExit(f"Unexpected byte length: {len(data)}")
          target = Path("scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js")
          target.write_bytes(data)
          print(f"Verified {target}: {len(data)} bytes, SHA-256 {digest}")
      - name: Commit v1.8 and remove staging files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
          git rm -f --ignore-unmatch scripts/tampermonkey/.v1.8-payload.b64
          git rm -f --ignore-unmatch .github/workflows/install-rumble-v18.yml
          git commit -m "Update Rumble Chat Tool to v1.8"
          git push origin HEAD:main
