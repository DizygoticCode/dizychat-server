name: DizyChat Self-Host CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  self-host-ui-test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify self-host configuration
        run: npm test

      - name: Smoke test self-hosted LiveKit
        shell: bash
        run: |
          set -Eeuo pipefail
          compose=(docker compose -f deploy/livekit/compose.yaml)
          cleanup() {
            status=$?
            if (( status != 0 )); then
              "${compose[@]}" logs --no-color livekit || true
            fi
            "${compose[@]}" down --volumes --remove-orphans || true
            rm -f deploy/livekit/livekit.yaml
            exit "$status"
          }
          trap cleanup EXIT

          ./deploy/livekit/generate-config.sh > /dev/null
          "${compose[@]}" config --quiet
          "${compose[@]}" up --detach livekit

          for _ in {1..60}; do
            if curl --silent --output /dev/null --max-time 2 http://127.0.0.1:7880/; then
              exit 0
            fi
            sleep 1
          done
          echo "LiveKit signaling listener did not become reachable" >&2
          exit 1

      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Start isolated local DizyChat
        env:
          NODE_ENV: test
          PORT: 10000
          MONGO_URI: mongodb://127.0.0.1:27017/dizychat_ci
          SOCKET_IO_CORS_ORIGINS: http://127.0.0.1:10000
        run: |
          nohup npm start > /tmp/dizychat-ci.log 2>&1 &
          echo $! > /tmp/dizychat-ci.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:10000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dizychat-ci.log
          exit 1

      - name: Prepare UI artifacts
        run: |
          TIMESTAMP=$(date +%s)
          mkdir -p ui-test-artifacts/playwright_videos
          echo "TIMESTAMP=$TIMESTAMP" >> "$GITHUB_ENV"

      - name: Run local UI smoke test
        env:
          TIMESTAMP: ${{ env.TIMESTAMP }}
          DEPLOY_URL: http://127.0.0.1:10000
        run: node tests/ui-test.cjs

      - name: Run mobile shell regression
        env:
          DEPLOY_URL: http://127.0.0.1:10000
        run: node tests/mobile-shell-ui-test.cjs

      - name: Upload UI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-artifacts-${{ env.TIMESTAMP }}
          path: ui-test-artifacts/
          if-no-files-found: warn

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/dizychat-ci.log || true
