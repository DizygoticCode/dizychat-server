name: Temporary branch verifier for Rumble max users 300

on:
  push:
    branches:
      - feat/rumble-curated-max-users-300

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Capture exact head
        id: head
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify userscript syntax
        run: node --check scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js

      - name: Run all Rumble source regressions
        run: node --test scripts/tests/*.test.mjs

      - name: Comment GREEN on PR 340
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ steps.head.outputs.sha }}
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/340/comments" \
            -d "{\"body\":\"✅ Branch verifier GREEN on exact head $TESTED_SHA: userscript syntax and all scripts/tests/*.test.mjs passed.\"}"

      - name: Comment RED on PR 340
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ steps.head.outputs.sha }}
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/340/comments" \
            -d "{\"body\":\"❌ Branch verifier RED on exact head $TESTED_SHA. Production is still at 120; inspect the failing 300-profile regression.\"}"
