name: One-off Rumble burn reply delay v1.9.6

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/rumble-burn-reply-delay-v196'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Run burn reply delay regression test
        run: node --test scripts/tests/rumble-burn-reply-delay-source.test.mjs

      - name: Verify userscript syntax
        run: node --check scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js

      - name: Verify PR diff whitespace
        run: git diff --check origin/main...HEAD
