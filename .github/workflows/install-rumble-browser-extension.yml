name: Install Rumble Browser Extension Source

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  install:
    if: github.event.issue.title == 'INSTALL_RUMBLE_BROWSER_EXTENSION'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reconstruct verified extension source
        shell: bash
        run: |
          set -euo pipefail
          cat .browser-extension-install/payload-* > /tmp/extension.tar.bz2.b64
          base64 -d /tmp/extension.tar.bz2.b64 > /tmp/extension.tar.bz2
          echo '90ed24820bd16d3c1cba97564b00e74659d07048a128d99e56b64affcb9e636e  /tmp/extension.tar.bz2' | sha256sum -c -
          tar -xjf /tmp/extension.tar.bz2 -C .
          rm -rf .browser-extension-install
          rm -f .github/workflows/install-rumble-browser-extension.yml
          chmod +x browser-extension/scripts/*.sh
          git add -A
          git config user.name 'DizygoticCode'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Add cross-browser Rumble Chat Companion extension'
          git push origin HEAD:main
