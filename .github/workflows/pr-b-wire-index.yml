name: Android Slice 2 PR B wire index

on:
  push:
    branches:
      - feat/android-slice2-pr-b
    paths:
      - .github/workflows/pr-b-wire-index.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR B branch
        uses: actions/checkout@v4
        with:
          ref: feat/android-slice2-pr-b
          fetch-depth: 0

      - name: Apply exact index patch
        run: node scripts/apply-android-pr-b-index.js

      - name: Remove one-shot patch tooling
        run: rm scripts/apply-android-pr-b-index.js .github/workflows/pr-b-wire-index.yml

      - name: Commit production-only patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js scripts/apply-android-pr-b-index.js .github/workflows/pr-b-wire-index.yml
          git diff --cached --check
          git commit -m "feat: wire Android Slice 2 background reply"
          git push origin HEAD:feat/android-slice2-pr-b
