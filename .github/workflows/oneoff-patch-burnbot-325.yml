name: One-off patch Burn Bot PR 325

on:
  pull_request_target:
    types: [synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    if: github.event.pull_request.number == 325 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'burnbot-savage-v1.9.5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: burnbot-savage-v1.9.5
          fetch-depth: 0

      - name: Patch current userscript
        run: python scripts/patch-burnbot-v195.py

      - name: Verify JavaScript syntax and boundaries
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
          grep -F '// @version      1.9.5' scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
          grep -F 'const burnTagPressure = new Map();' scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
          grep -F 'you tagged me just to volunteer as the punchline' scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
          ! grep -F 'fallbackCorpus' scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
          ! grep -F 'your hot take just failed the deterministic test suite' scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
          git diff --check

      - name: Commit verified userscript
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/patch-burnbot-v195.py \
            scripts/.burnbot-v195-trigger \
            .github/workflows/oneoff-burnbot-savage-v195.yml \
            .github/workflows/oneoff-burnbot-savage-v195-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Upgrade Rumble burn bot to savage v1.9.5'
          git push origin HEAD:burnbot-savage-v1.9.5
