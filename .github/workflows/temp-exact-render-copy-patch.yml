name: Temporary exact Render copy patch

on:
  push:
    branches:
      - cleanup/remove-final-render-runtime-copy
    paths:
      - .github/workflows/temp-exact-render-copy-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'remove temporary exact patch workflow') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/remove-final-render-runtime-copy
          fetch-depth: 0

      - name: Apply exactly two literal replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.js')
          source = path.read_text(encoding='utf-8')
          replacements = {
              '// ===== DIZYCHAT FUSION — SUPERNOVA LIVE (Render Edition) =====':
                  '// ===== DIZYCHAT FUSION — SUPERNOVA LIVE (Self-Hosted Edition) =====',
              "Watch2Gether is not configured yet. Add W2G_API_KEY in Render.":
                  "Watch2Gether is not configured yet. Add W2G_API_KEY to the protected runtime environment.",
          }

          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              source = source.replace(old, new, 1)

          if 'Render Edition' in source or 'Add W2G_API_KEY in Render.' in source:
              raise SystemExit('stale Render runtime copy survived replacement')

          path.write_text(source, encoding='utf-8')
          PY

      - name: Prove only index.js changed
        run: |
          git diff --check
          test "$(git diff --name-only)" = "index.js"
          git diff -- index.js

      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js
          git commit -m "chore: remove final Render runtime copy"
          git push origin HEAD:cleanup/remove-final-render-runtime-copy
