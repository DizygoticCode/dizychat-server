name: Apply Rumble Lazy IndexedDB Patch

on:
  push:
    branches:
      - fix/rumble-userscript-dizychat-lazy-db
    paths:
      - 'scripts/maintenance/apply-rumble-lazy-indexeddb-patch.py'
      - '.github/workflows/apply-rumble-lazy-indexeddb-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rumble-userscript-dizychat-lazy-db
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply narrow userscript patch
        run: python scripts/maintenance/apply-rumble-lazy-indexeddb-patch.py
      - name: Syntax check userscript
        run: node --check scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
      - name: Run userscript regression tests
        run: node --test scripts/tests/*.test.mjs
      - name: Check diff whitespace
        run: git diff --check
      - name: Commit verified production patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js scripts/tests/rumble-chat-indexeddb-source.test.mjs scripts/tests/rumble-userscript-version-source.test.mjs
          git diff --cached --quiet && { echo 'No production changes to commit'; exit 1; }
          git commit -m 'fix: lazy-load Rumble transcript and repair DizyChat handoff'
          git push origin HEAD:fix/rumble-userscript-dizychat-lazy-db
