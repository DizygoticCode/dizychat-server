name: PR C Task 2 index patch

on:
  push:
    branches:
      - feat/android-slice2-pr-c
    paths:
      - .github/workflows/pr-c-task2-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/android-slice2-pr-c
          fetch-depth: 0
      - name: Apply exact Task 2 patch
        run: node .github/scripts/pr-c-task2-patch.js
      - name: Commit production patch and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js .github/scripts/pr-c-task2-patch.js .github/workflows/pr-c-task2-patch.yml
          git diff --cached --check
          git commit -m "feat: converge account read-state propagation"
          git push origin HEAD:feat/android-slice2-pr-c
