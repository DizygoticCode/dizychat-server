name: Patch Rumble hydration yield

on:
  push:
    branches:
      - fix/rumble-hydration-yield
    paths:
      - .github/workflows/patch-rumble-hydration-yield.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rumble-hydration-yield
          fetch-depth: 0
      - name: Apply guarded patch
        run: python3 scripts/patch-rumble-hydration-yield.py
      - name: Verify userscript
        run: |
          node --check scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
          node --test scripts/tests/*.test.mjs
      - name: Commit clean patch
        run: |
          rm .github/workflows/patch-rumble-hydration-yield.yml
          rm scripts/patch-rumble-hydration-yield.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: yield automatic transcript backfill"
          git push origin HEAD:fix/rumble-hydration-yield
