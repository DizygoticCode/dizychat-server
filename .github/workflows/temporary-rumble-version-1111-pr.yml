name: Temporary PR verifier for Rumble v1.11.1

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'fix/rumble-userscript-version-1111'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rumble-userscript-version-1111
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repair v1.11.1 metadata and stale version-only assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path('scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js')
          text = script.read_text()
          old = '// @version      1.11.0'
          new = '// @version      1.11.1'
          if old in text:
              assert text.count(old) == 1
              script.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('unexpected userscript version metadata')

          personalities = Path('scripts/tests/rumble-burn-personalities-v1110-source.test.mjs')
          text = personalities.read_text()
          old_name = 'test("v1.11.0 exposes the new personality engines in Burn Bot preferences", () => {'
          new_name = 'test("v1.11+ exposes the personality engines in Burn Bot preferences", () => {'
          old_assert = 'assert.match(source, /\\/\\/ @version\\s+1\\.11\\.0/);'
          new_assert = 'assert.match(source, /\\/\\/ @version\\s+1\\.11\\.\\d+/);'
          if old_name in text:
              text = text.replace(old_name, new_name, 1)
          if old_assert in text:
              text = text.replace(old_assert, new_assert, 1)
          personalities.write_text(text)

          relevance = Path('scripts/tests/rumble-curated-relevance-v1101-source.test.mjs')
          text = relevance.read_text()
          old_assert = 'assert.match(source, /\\/\\/ @version\\s+1\\.(?:10\\.1|11\\.0)/);'
          new_assert = 'assert.match(source, /\\/\\/ @version\\s+1\\.(?:10\\.1|11\\.\\d+)/);'
          if old_assert in text:
              text = text.replace(old_assert, new_assert, 1)
          relevance.write_text(text)
          PY
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js scripts/tests/rumble-burn-personalities-v1110-source.test.mjs scripts/tests/rumble-curated-relevance-v1101-source.test.mjs
            git commit -m 'test: allow v1.11 patch releases in legacy Rumble contracts'
            git push origin HEAD:fix/rumble-userscript-version-1111
          fi

      - name: Capture exact tested head
        id: head
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Userscript syntax
        run: node --check scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js

      - name: Rumble source regressions
        run: node --test scripts/tests/*.test.mjs

      - name: Comment GREEN on PR 343
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ steps.head.outputs.sha }}
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/343/comments" \
            -d "{\"body\":\"✅ v1.11.1 verifier GREEN on exact head $TESTED_SHA: userscript syntax and all scripts/tests/*.test.mjs passed.\"}"
