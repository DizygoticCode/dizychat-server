name: One-off Rumble Curated v1.10.1

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch-and-verify:
    if: github.event.issue.title == 'PATCH_RUMBLE_V1101'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rumble-curated-relevance-v1101
          fetch-depth: 0
      - name: Prove RED contract before production patch
        id: red
        shell: bash
        run: |
          set +e
          node --test scripts/tests/rumble-curated-relevance-v1101-source.test.mjs > /tmp/red.log 2>&1
          rc=$?
          cat /tmp/red.log
          if [ "$rc" -eq 0 ]; then
            echo 'RED contract unexpectedly passed before implementation'
            exit 1
          fi
          echo 'RED contract failed as expected'
      - name: Disambiguate patch helper anchor
        run: python scripts/fix-v1101-helper-anchor.py
      - name: Apply v1.10.1 implementation
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/patch-rumble-curated-v1101.py > /tmp/patch.log 2>&1
          rc=$?
          cat /tmp/patch.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc
      - name: Report patch diagnostic
        if: steps.patch.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('/tmp/patch.log') ? fs.readFileSync('/tmp/patch.log','utf8').slice(-6000) : 'no patch log';
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `v1.10.1 patch helper failed:\n\n\`\`\`text\n${log}\n\`\`\`` });
      - name: Enforce patch success
        if: steps.patch.outcome != 'success'
        run: exit 1
      - name: Run v1.10.1 contract GREEN
        id: green
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node --test scripts/tests/rumble-curated-relevance-v1101-source.test.mjs > /tmp/green.log 2>&1
          rc=$?
          cat /tmp/green.log
          exit $rc
      - name: Report GREEN diagnostic
        if: steps.green.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('/tmp/green.log') ? fs.readFileSync('/tmp/green.log','utf8').slice(-7000) : 'no green log';
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `v1.10.1 GREEN contract failed:\n\n\`\`\`text\n${log}\n\`\`\`` });
      - name: Enforce GREEN success
        if: steps.green.outcome != 'success'
        run: exit 1
      - name: Run all Rumble source regressions
        shell: bash
        run: |
          set -euo pipefail
          for testfile in scripts/tests/rumble-*-source.test.mjs; do
            node --test "$testfile"
          done
      - name: Verify userscript syntax
        run: node --check scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
      - name: Verify diff whitespace
        run: git diff --check origin/main...HEAD
      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/patch-rumble-curated-v1101.py scripts/fix-v1101-helper-anchor.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js \
            scripts/tests/rumble-curated-v2-source.test.mjs \
            scripts/tests/rumble-curated-relevance-v1101-source.test.mjs \
            scripts/patch-rumble-curated-v1101.py \
            scripts/fix-v1101-helper-anchor.py
          git diff --cached --check
          git commit -m 'Tune Rumble Burn Bot relevance and personas v1.10.1'
          git push origin HEAD:fix/rumble-curated-relevance-v1101
      - name: Report result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const body = ok
              ? 'v1.10.1 RED→GREEN patch/verification completed successfully on `fix/rumble-curated-relevance-v1101`.'
              : 'v1.10.1 patch/verification failed. Branch was not claimed green.';
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            if (ok) await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed' });
