name: One-off Rumble Curated v1.10.1 Final Verify

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: github.event.issue.title == 'VERIFY_RUMBLE_V1101'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 29a5211fc21e3cbb58c6abb41aba5ae28f6026f9
          fetch-depth: 0
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "29a5211fc21e3cbb58c6abb41aba5ae28f6026f9"
      - name: Verify temporary helpers absent
        run: |
          test ! -e scripts/patch-rumble-curated-v1101.py
          test ! -e scripts/fix-v1101-helper-anchor.py
      - name: Run all Rumble source regressions
        shell: bash
        run: |
          set -euo pipefail
          for testfile in scripts/tests/rumble-*-source.test.mjs; do
            node --test "$testfile"
          done
      - name: Verify userscript syntax
        run: node --check scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
      - name: Verify PR diff whitespace
        run: git diff --check origin/main...HEAD
      - name: Report result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const body = ok
              ? 'FINAL v1.10.1 exact-head verification **SUCCESS** on `29a5211fc21e3cbb58c6abb41aba5ae28f6026f9`: all Rumble source regressions, userscript syntax, helper absence, and diff check passed.'
              : 'FINAL v1.10.1 exact-head verification **FAILED** on `29a5211fc21e3cbb58c6abb41aba5ae28f6026f9`.';
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            if (ok) await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed' });
