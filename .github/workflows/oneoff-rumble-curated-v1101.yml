name: One-off Rumble Curated v1.10.1

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/rumble-curated-relevance-v1101'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Run Curated v1.10.1 contract
        id: contract
        continue-on-error: true
        run: node --test scripts/tests/rumble-curated-relevance-v1101-source.test.mjs
      - name: Report contract result on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.contract.outcome }}';
            const sha = context.payload.pull_request.head.sha;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Curated v1.10.1 verifier: **${outcome.toUpperCase()}** on \`${sha}\``
            });
      - name: Enforce contract result
        if: steps.contract.outcome != 'success'
        run: exit 1
