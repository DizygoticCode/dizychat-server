name: Apply and validate Rumble Companion v1.8.1 backup fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/patch-rumble-autobackup-v181.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.head_ref == 'fix/rumble-autobackup-v181'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply guarded v1.8.1 patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js')
          s = path.read_text()

          def one(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              s = s.replace(old, new, 1)

          one('// @version      1.8\n', '// @version      1.8.1\n', 'version')
          one('    const BACKUP_KEY = "rumbleLastBackup";\n', '    const BACKUP_KEY = "rumbleLastBackup";\n    const BACKUP_FILENAME = "dizygotic-rumble-chat-tool-settings-backup.json";\n', 'backup filename')

          one('''    function serializeData() {
        const data = { blockedUsers, settings };
        const serialized = JSON.stringify(data, null, 2);
        localStorage.setItem(BACKUP_KEY, JSON.stringify(data));
        return serialized;
    }
''', '''    function settingsSnapshot() {
        return { blockedUsers, settings };
    }

    function getBackupStatusText() {
        const raw = localStorage.getItem(BACKUP_KEY);
        if (!raw) return `Last local backup: none yet · ${BACKUP_FILENAME}`;
        try {
            const backup = JSON.parse(raw);
            const meta = backup?.backupMeta;
            if (!meta?.savedAt) return `Last local backup: legacy backup present · ${BACKUP_FILENAME}`;
            const saved = new Date(meta.savedAt);
            const when = Number.isNaN(saved.getTime()) ? meta.savedAt : saved.toLocaleString();
            return `Last local backup: ${when} · ${meta.filename || BACKUP_FILENAME}`;
        } catch (err) {
            console.warn("Unable to read local backup metadata", err);
            return `Last local backup: unreadable · ${BACKUP_FILENAME}`;
        }
    }

    function updateBackupStatus(root = document) {
        const status = root?.querySelector?.("#lastAutoBackupStatus");
        if (status) status.textContent = getBackupStatusText();
    }

    function saveLocalBackup(reason = "auto") {
        const backup = {
            ...settingsSnapshot(),
            backupMeta: {
                schemaVersion: 1,
                filename: BACKUP_FILENAME,
                savedAt: new Date().toISOString(),
                reason
            }
        };
        localStorage.setItem(BACKUP_KEY, JSON.stringify(backup));
        updateBackupStatus();
        return backup;
    }

    function serializeData() {
        return JSON.stringify(settingsSnapshot(), null, 2);
    }
''', 'backup helpers')

          one('''    function exportData(filename = "dizygotic-rumble-chat-tool-settings.json", options = {}) {
        const serialized = serializeData();
        triggerDownload(filename, serialized, options);
        return serialized;
    }
''', '''    function exportData(filename = "dizygotic-rumble-chat-tool-settings.json", options = {}) {
        const serialized = serializeData();
        saveLocalBackup("manual-export");
        triggerDownload(filename, serialized, options);
        return serialized;
    }
''', 'manual export')

          one('''    let backupIntervalId = null;
    function setupAutoBackup() {
        if (backupIntervalId) clearInterval(backupIntervalId);
        if (settings.autoBackupMinutes > 0) {
            backupIntervalId = setInterval(() => {
                const timestamp = new Date().toISOString().replace(/[:.]/g, "-");
                exportData(`dizygotic-rumble-chat-tool-settings-backup-${timestamp}.json`, {
                    silent: true,
                    prompt: false
                });
                console.log("💾 Auto-backup created");
            }, settings.autoBackupMinutes * 60 * 1000);
        }
    }
''', '''    let backupIntervalId = null;
    function setupAutoBackup() {
        if (backupIntervalId) clearInterval(backupIntervalId);
        backupIntervalId = null;
        if (settings.autoBackupMinutes > 0) {
            backupIntervalId = setInterval(() => {
                saveLocalBackup("auto");
                console.log(`💾 Auto-backup saved locally as ${BACKUP_FILENAME}`);
            }, settings.autoBackupMinutes * 60 * 1000);
        }
    }
''', 'auto backup')

          one('''                <input type="number" id="autoBackupInput" value="${settings.autoBackupMinutes}" style="width:80px;margin-left:auto">
            </div>

            <div style="height:14px"></div>
''', '''                <input type="number" id="autoBackupInput" value="${settings.autoBackupMinutes}" style="width:80px;margin-left:auto">
            </div>
            <div id="lastAutoBackupStatus" style="font-size:12px;color:gray;margin-top:5px"></div>
            <div style="font-size:12px;color:gray;margin-top:3px">Automatic backups silently overwrite one local browser backup slot. Only manual Export opens a file download.</div>

            <div style="height:14px"></div>
''', 'backup panel')

          one('        applyThemeToPanel(panel);\n\n        const loadInstalledFontsBtn', '        applyThemeToPanel(panel);\n        updateBackupStatus(panel);\n\n        const loadInstalledFontsBtn', 'backup status init')
          path.write_text(s)

          pkg_path = Path('browser-extension/package.json')
          pkg = json.loads(pkg_path.read_text())
          pkg['version'] = '1.8.1'
          pkg_path.write_text(json.dumps(pkg, indent=2) + '\n')

          readme_path = Path('README.md')
          r = readme_path.read_text()
          r = r.replace('**Dizygotic Rumble Chat Companion v1.8**', '**Dizygotic Rumble Chat Companion v1.8.1**')
          r = r.replace('**Rumble Chat Companion v1.8**', '**Rumble Chat Companion v1.8.1**')
          needle = '- **Rumble Chat Companion v1.8.1** – the companion userscript now adds a bounded passive transcript recorder with JSON/CSV export, configurable installed fonts/font sizes/text colours, per-character rainbow and multi-colour display modes, independently enableable burn engines, backward-compatible settings import/export, and the existing block/highlight/DM toolset.'
          if needle not in r:
              raise SystemExit('README companion bullet not found')
          r = r.replace(needle, needle + ' Auto-backup now silently overwrites a single localStorage backup slot with timestamp/filename metadata; only manual Export opens a download.', 1)
          readme_path.write_text(r)
          PY

      - name: Validate userscript contract
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js').read_text()
          assert '// @version      1.8.1' in s
          block = re.search(r'    function setupAutoBackup\(\) \{.*?\n    \}\n\n    /\*\*', s, re.S)
          assert block
          b = block.group(0)
          assert 'saveLocalBackup("auto")' in b
          assert 'exportData(' not in b
          assert 'triggerDownload(' not in b
          assert 'BACKUP_FILENAME = "dizygotic-rumble-chat-tool-settings-backup.json"' in s
          assert 'backupMeta:' in s and 'savedAt:' in s and 'filename: BACKUP_FILENAME' in s
          PY

      - name: Build and package Chromium Firefox Safari
        shell: bash
        run: |
          set -euo pipefail
          ./browser-extension/scripts/fetch-vendor.sh
          node browser-extension/build.mjs
          ./browser-extension/scripts/package.sh
          node --check browser-extension/dist/chromium/content-core.js
          node --check browser-extension/dist/firefox/content-core.js
          node --check browser-extension/dist/safari/content-core.js
          python - <<'PY'
          import json
          from pathlib import Path
          for target in ('chromium', 'firefox', 'safari'):
              manifest = json.loads((Path('browser-extension/dist') / target / 'manifest.json').read_text())
              assert manifest['version'] == '1.8.1', (target, manifest['version'])
          PY

      - name: Commit verified patch to PR branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/patch-rumble-autobackup-v181.yml
          git add -A
          git config user.name 'DizygoticCode'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Fix silent local auto-backup in Rumble Companion v1.8.1'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
