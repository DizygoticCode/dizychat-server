name: Validate Rumble v1.9.2 runtime repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-validate-push:
    if: github.head_ref == 'fix/rumble-burn-runtime-v192'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rumble-burn-runtime-v192
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply guarded patch when needed
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
          if grep -Fq '// @version      1.9.1' "$SCRIPT"; then
            git fetch origin main
            git show FETCH_HEAD:scripts/maintenance/rumble-v192-runtime-patch.py > /tmp/rumble-v192-runtime-patch.py
            python /tmp/rumble-v192-runtime-patch.py
            echo 'RUMBLE_V192_PATCHED=1' >> "$GITHUB_ENV"
          else
            grep -F '// @version      1.9.2' "$SCRIPT"
            echo 'RUMBLE_V192_PATCHED=0' >> "$GITHUB_ENV"
          fi

      - name: Validate userscript contracts
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
          node --check "$SCRIPT"
          grep -F '// @version      1.9.2' "$SCRIPT"
          grep -F 'maybeLearnSelfNickname(record);' "$SCRIPT"
          grep -F 'async function sendChatMessage(message)' "$SCRIPT"
          grep -F 'async function maybeHandleAutoBurn(ctx)' "$SCRIPT"
          grep -F 'id="myNicknameInput"' "$SCRIPT"
          grep -F 'id="autoBurnRuntimeStatus"' "$SCRIPT"
          grep -F 'text/csv;charset=utf-8' "$SCRIPT"
          grep -F 'application/json;charset=utf-8' "$SCRIPT"
          grep -F 'same paste again — the archive has clocked this template' "$SCRIPT"
          grep -F 'window.rumbleBlocker.getBurnRuntimeStatus' "$SCRIPT"
          grep -F 'window.rumbleBlocker.sendChatMessage' "$SCRIPT"
          git diff --check

      - name: Build Chromium Firefox and Safari source
        shell: bash
        run: |
          set -euo pipefail
          ./browser-extension/scripts/fetch-vendor.sh
          node browser-extension/build.mjs
          ./browser-extension/scripts/package.sh
          test -f browser-extension/dist/dizygotic-rumble-chat-companion-v1.9.2-chromium.zip
          test -f browser-extension/dist/dizygotic-rumble-chat-companion-v1.9.2-firefox.zip
          test -f browser-extension/dist/dizygotic-rumble-chat-companion-v1.9.2-safari-source.zip
          node --check browser-extension/dist/chromium/content.js
          node --check browser-extension/dist/firefox/content.js
          node --check browser-extension/dist/safari/content.js
          cat browser-extension/dist/SHA256SUMS.txt

      - name: Push exact validated product patch
        if: env.RUMBLE_V192_PATCHED == '1'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf browser-extension/vendor browser-extension/dist
          rm -f .github/rumble-v192-request
          git add -A .github/rumble-v192-request scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js README.md browser-extension/README.md
          git diff --cached --check
          git config user.name 'DizygoticCode'
          git config user.email 'rob.noyce@gmail.com'
          git commit -m 'Fix Rumble Burn Bot live composer runtime v1.9.2'
          git push origin HEAD:fix/rumble-burn-runtime-v192

      - name: Confirm clean synchronized head
        if: env.RUMBLE_V192_PATCHED == '0'
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/rumble-v192-request
          test -z "$(git status --short --untracked-files=no)"
