name: One-off burn bot savage v1.9.5 PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'burnbot-savage-v1.9.5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Narrow one-off stale-template assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/patch-burnbot-v195.py')
          text = path.read_text(encoding='utf-8')
          old = '''    "requested a rollback",\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one broad rollback assertion, found {text.count(old)}')
          text = text.replace(old, '''    "the logs saw that ${noun} and immediately requested a rollback.",\n''', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Patch current userscript
        run: python scripts/patch-burnbot-v195.py

      - name: Verify JavaScript syntax
        run: node --check scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js

      - name: Verify patch boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -F '// @version      1.9.5' scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
          grep -F 'const burnTagPressure = new Map();' scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
          grep -F 'you tagged me just to volunteer as the punchline' scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
          ! grep -F 'fallbackCorpus' scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
          ! grep -F 'your hot take just failed the deterministic test suite' scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
          git diff --check

      - name: Commit verified userscript and remove one-off machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/patch-burnbot-v195.py \
            scripts/.burnbot-v195-trigger \
            .github/workflows/oneoff-burnbot-savage-v195.yml \
            .github/workflows/oneoff-burnbot-savage-v195-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Upgrade Rumble burn bot to savage v1.9.5'
          git push origin HEAD:burnbot-savage-v1.9.5
