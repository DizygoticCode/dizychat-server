name: Apply ClamAV docs patch

on:
  push:
    branches:
      - feat/clamav-upload-gate
    paths:
      - .github/workflows/apply-clamav-docs.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/clamav-upload-gate
          fetch-depth: 0
      - name: Update ClamAV self-host documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          replacements = [
            (
              '- MIME, file-signature, and antivirus enforcement are currently disabled while mobile camera/library upload compatibility is being verified; uploaded files are not passing through those security gates for now.\n',
              '- Upload MIME/file-signature rejection remains intentionally permissive for mobile compatibility, while every completed upload is quarantined and must receive a clean local ClamAV verdict before it becomes publicly accessible.\n',
            ),
            (
              '- Upload antivirus/type-signature enforcement is temporarily disabled while mobile upload compatibility is being verified.\n',
              '- **ClamAV daemon and `clamdscan`** are required for uploads; scanning is local and fails closed if the scanner is unavailable.\n',
            ),
            (
              '| `MAX_UPLOAD_SIZE_MB` | File upload cap; accepts values like `50`, `50mb`, or `2gb`. Use `unlimited` to disable the limit. |\n',
              '| `MAX_UPLOAD_SIZE_MB` | File upload cap; accepts values like `50`, `50mb`, or `2gb`. Use `unlimited` to disable the limit. |\n| `UPLOAD_QUARANTINE_DIR` | Private pre-scan upload directory; defaults to `/var/lib/dizychat/upload-quarantine`. It must not be inside the web-served `public/` tree. |\n| `CLAMAV_SCAN_COMMAND` | Local ClamAV client command; defaults to `clamdscan`. |\n| `CLAMAV_SCAN_TIMEOUT_MS` | Per-file ClamAV timeout in milliseconds; defaults to `120000` and is bounded between 5000 and 600000. |\n',
            ),
            (
              '### Production mode\nLaunch the server with Node:\n```bash\nnpm start\n```\n',
              '''### Production mode\nLaunch the server with Node:\n```bash\nnpm start\n```\n\n### ClamAV upload scanning\n\nDizyChat keeps the existing `/uploads/...` URL contract but no longer writes an incoming file directly into the public upload store. Multer writes the complete file to `UPLOAD_QUARANTINE_DIR`, `clamdscan --fdpass --no-summary` asks the local ClamAV daemon for the verdict, and only a clean file is atomically renamed into `public/uploads`. Infected files and scanner errors/timeouts are deleted from quarantine and rejected. MIME and file-signature allowlists are deliberately not used as an acceptance gate, preserving Android/HEIC/WebM/3GP and other mobile upload compatibility.\n\nOn Ubuntu/Debian self-hosts:\n```bash\nsudo apt update\nsudo apt install -y clamav clamav-daemon\nsudo systemctl enable --now clamav-freshclam clamav-daemon\nsudo install -d -o dizy -g dizy -m 0700 /var/lib/dizychat/upload-quarantine\nclamdscan --fdpass --no-summary /etc/hosts\n```\n\nThe last command should report `/etc/hosts: OK`. Keep quarantine outside every web-served or symlink-exposed directory. The current DizyChat self-host may continue using `public/uploads -> /var/soundboards/uploads`; existing files and URLs do not need to move for ClamAV.\n''',
            ),
          ]
          for old, new in replacements:
            count = s.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one docs target, found {count}: {old[:100]!r}')
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --check
          git commit -m "docs: document local ClamAV upload scanning"
          git push origin HEAD:feat/clamav-upload-gate
