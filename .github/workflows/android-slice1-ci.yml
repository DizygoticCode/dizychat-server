name: Android Slice 1 CI

on:
  push:
    branches:
      - feat/android-slice1-core
      - fix/android-relative-media-urls
  pull_request:
    paths:
      - 'android/**'
      - 'public/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/prepare-android-assets.js'
      - 'index.js'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-slice1-ci.yml'
      - 'docs/android-private-apk.md'

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic tests
        run: npm test

      - name: Prepare packaged Android assets
        run: npm run android:prepare

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build unsigned debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dizychat-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
