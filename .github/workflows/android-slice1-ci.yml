name: Android Slice 1 CI

on:
  push:
    branches:
      - feat/android-slice1-core
      - fix/android-relative-media-urls
  pull_request:
    paths:
      - 'android/**'
      - 'public/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/prepare-android-assets.js'
      - 'index.js'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-slice1-ci.yml'
      - 'docs/android-private-apk.md'

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Provision Firebase Android config
        env:
          DIZYCHAT_GOOGLE_SERVICES_JSON_B64: ${{ secrets.DIZYCHAT_GOOGLE_SERVICES_JSON_B64 }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${DIZYCHAT_GOOGLE_SERVICES_JSON_B64:-}" ]]; then
            echo "::error::DIZYCHAT_GOOGLE_SERVICES_JSON_B64 repository secret is required to build the push-enabled Android APK."
            exit 1
          fi

          mkdir -p android/app
          printf '%s' "$DIZYCHAT_GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json

          node <<'NODE'
          const fs = require('node:fs');
          const configPath = 'android/app/google-services.json';

          let config;
          try {
            config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          } catch {
            console.error('::error::Firebase Android config is not valid JSON.');
            process.exit(1);
          }

          const projectId = config?.project_info?.project_id;
          if (projectId !== 'dizychat') {
            console.error(`::error::Firebase Android config must target project dizychat, got ${projectId || '<missing>'}.`);
            process.exit(1);
          }

          const hasDizyChatPackage = (config?.client || []).some(
            (client) => client?.client_info?.android_client_info?.package_name === 'com.chat.dizychat',
          );
          if (!hasDizyChatPackage) {
            console.error('::error::Firebase Android config does not contain package com.chat.dizychat.');
            process.exit(1);
          }

          console.log('Firebase Android config validated for project dizychat / com.chat.dizychat.');
          NODE

      - name: Provision Android release signing material
        env:
          DIZYCHAT_RELEASE_KEYSTORE_B64: ${{ secrets.DIZYCHAT_RELEASE_KEYSTORE_B64 }}
          DIZYCHAT_KEY_ALIAS: ${{ secrets.DIZYCHAT_KEY_ALIAS }}
          DIZYCHAT_KEYSTORE_PASSWORD: ${{ secrets.DIZYCHAT_KEYSTORE_PASSWORD }}
          DIZYCHAT_KEY_PASSWORD: ${{ secrets.DIZYCHAT_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          for name in \
            DIZYCHAT_RELEASE_KEYSTORE_B64 \
            DIZYCHAT_KEY_ALIAS \
            DIZYCHAT_KEYSTORE_PASSWORD \
            DIZYCHAT_KEY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name repository secret is required to build the signed Android release APK."
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          printf '%s' "$DIZYCHAT_RELEASE_KEYSTORE_B64" | base64 --decode > android/app/dizychat-release.jks
          chmod 600 android/app/dizychat-release.jks
          echo "Android release signing material provisioned."

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic tests
        run: npm test

      - name: Prepare packaged Android assets
        run: npm run android:prepare

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Run Android JVM tests and build unsigned debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Build signed release APK
        working-directory: android
        env:
          DIZYCHAT_KEYSTORE_PATH: ${{ github.workspace }}/android/app/dizychat-release.jks
          DIZYCHAT_KEY_ALIAS: ${{ secrets.DIZYCHAT_KEY_ALIAS }}
          DIZYCHAT_KEYSTORE_PASSWORD: ${{ secrets.DIZYCHAT_KEYSTORE_PASSWORD }}
          DIZYCHAT_KEY_PASSWORD: ${{ secrets.DIZYCHAT_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify signed release APK
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="android/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$SOURCE_APK" ]]; then
            echo "::error::Signed release APK was not produced."
            exit 1
          fi

          mv android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/dizychat-v1.apk
          APK="android/app/build/outputs/apk/release/dizychat-v1.apk"

          APKSIGNER="$(find "${ANDROID_HOME:?}/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::Android apksigner was not found on the runner."
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dizychat-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: dizychat-android-release-apk
          path: android/app/build/outputs/apk/release/dizychat-v1.apk
          if-no-files-found: error
          retention-days: 7
