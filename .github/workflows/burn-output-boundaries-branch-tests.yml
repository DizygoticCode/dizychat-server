name: Burn output boundary branch tests

on:
  push:
    branches:
      - feat/burn-output-boundaries

permissions:
  contents: write

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/burn-output-boundaries
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded Burn Bot patch
        run: node scripts/patches/apply-burn-output-boundaries.mjs
      - name: Commit generated source when needed
        shell: bash
        run: |
          if git diff --quiet -- scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js scripts/tests/rumble-userscript-version-source.test.mjs; then
            echo "Userscript already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js scripts/tests/rumble-userscript-version-source.test.mjs
          git commit -m "fix: bound and vary Burn Bot output"
          git push origin HEAD:feat/burn-output-boundaries
      - name: Check committed userscript syntax
        run: node --check scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
      - name: Run committed userscript source-contract tests
        run: node --test scripts/tests/*.test.mjs
