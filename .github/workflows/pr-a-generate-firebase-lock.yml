name: PR A Firebase lockfile generation

on:
  push:
    branches:
      - feat/android-slice2-pr-a
    paths:
      - .github/workflows/pr-a-generate-firebase-lock.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/android-slice2-pr-a
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Generate dependency and lockfile with npm
        run: npm install firebase-admin@14.3.0 --save-exact

      - name: Commit generated package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --check
          git commit -m "build: add firebase admin dependency"
          git push origin HEAD:feat/android-slice2-pr-a
