name: Burn selected-user branch tests

on:
  push:
    branches:
      - feat/burn-selected-user-triggers

permissions:
  contents: write

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply selected-user trigger patch
        run: node scripts/patch-rumble-burn-selected-user-wrapper.mjs
      - name: Check userscript syntax
        run: node --check scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
      - name: Run userscript source-contract tests
        run: node --test scripts/tests/*.test.mjs
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo "Userscript already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js scripts/tests/
          git commit -m "feat: add selected-user burn triggers"
          git push
