name: PR345 Rumble userscript tests

on:
  pull_request:
    branches:
      - ci/rumble-userscript-pr345-base
    paths:
      - 'scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js'
      - 'scripts/tests/**'
      - 'scripts/patch-rumble-pr345.mjs'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  source-tests:
    if: github.event.pull_request.number == 345 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded PR345 patch when needed
        run: |
          if grep -q '^// @version      1\.11\.1$' scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js; then
            node scripts/patch-rumble-pr345.mjs
          fi
      - name: Check userscript syntax
        run: node --check scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
      - name: Run userscript source tests
        run: node --test scripts/tests/*.test.mjs
      - name: Commit verified generated userscript
        run: |
          if git diff --quiet -- scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js; then
            echo 'Userscript already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
          git commit -m 'Scale curated memory and queue zero-cooldown burns'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
