name: Temporary Rumble userscript version verifier

on:
  push:
    branches:
      - fix/rumble-userscript-version-1111

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Userscript syntax
        run: node --check scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
      - name: Rumble source regressions
        run: node --test scripts/tests/*.test.mjs
