name: Temporary Rumble personalities v1.11.0 exact-head verifier

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  verify-exact-head:
    if: github.event.issue.title == 'VERIFY RUMBLE PERSONALITIES V1.11.0 EXACT HEAD'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rumble-burn-personalities-v1110
          fetch-depth: 0

      - name: Pin exact cleaned feature head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          expected="ab812783a16d8a5664dd643883cc498c9de7dd61"
          echo "actual=$actual"
          test "$actual" = "$expected"

      - name: Confirm temporary branch helpers are absent
        shell: bash
        run: |
          test ! -e scripts/ci/patch-rumble-personalities-v1110.py
          test ! -e .github/workflows/rumble-personalities-v1110.yml

      - name: Verify userscript syntax and every Rumble source regression
        shell: bash
        run: |
          node --check scripts/tampermonkey/dizygotic-rumble-chat-tool.user.js
          node --test scripts/tests/*.test.mjs

      - name: Confirm verifier is read-only
        shell: bash
        run: git diff --exit-code

      - name: Record exact-head success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.comments_url }}
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$ISSUE_URL" \
            -d '{"body":"✅ Exact cleaned head ab812783a16d8a5664dd643883cc498c9de7dd61 verified read-only: temporary branch helpers absent; userscript syntax and all Rumble source regressions passed; working tree remained unchanged."}'

      - name: Record exact-head failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.comments_url }}
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$ISSUE_URL" \
            -d '{"body":"❌ Exact-head v1.11.0 verification failed. Do not merge until the failing contract is identified."}'
